  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

left:auto;display:flex;gap:14px;align-items:center}\n  .hicon{position:relative;display:inline-flex;align-items:center;justify-content:center;width:34px;height:28px}\n  .hicon svg{width:34px;height:26px}\n  .badge{\n    position:absolute;top:-6px;right:-8px;background:var(--gold);color:#000;\n    border-radius:50%;min-width:16px;height:16px;font-size:9px;\n    display:grid;place-items:center;font-weight:700;padding:0 4px;\n  }\n \n  /* ---------- Suggest overlay ---------- */\n  .scrim{\n    position:fixed;inset:68px 0 0 0;background:rgba(0,0,0,.32);\n    z-index:50;opacity:0;pointer-events:none;transition:opacity .18s;\n  }\n  .scrim.on{opacity:1;pointer-events:auto}\n  .suggest{\n    position:fixed;top:68px;left:0;width:min(1120px,72vw);\n    background:var(--panel);z-index:55;\n    padding:26px 30px 30px;\n    max-height:calc(100vh - 68px);overflow:auto;\n    display:none;\n  }\n  .suggest.on{display:block}\n \n  .aihint{\n    background:var(--black);color:#fff;border-radius:3px;\n    padding:16px 20px;display:flex;align-items:center;gap:12px;\n    font-size:14px;margin-bottom:24px;width:100%;text-align:left;\n  }\n  .aihint .arrow{margin-left:auto}\n  .aihint:hover{background:#171717}\n \n  .understood{\n    background:var(--gold);border-radius:3px;padding:16px 18px;\n    display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:26px;\n  }\n  .understood #tokens{display:inline-flex;flex-wrap:wrap;gap:10px}\n  .understood .lbl{font-size:14px;margin-right:6px}\n  .tokchip{\n    background:var(--black);color:#fff;border-radius:999px;\n    padding:7px 14px;font-size:13px;display:inline-flex;align-items:center;gap:10px;\n  }\n  .tokchip .xbtn{display:inline-flex;align-items:center;padding:0;border:0;background:none;cursor:pointer}\n  .tokchip .xbtn svg{width:9px;height:9px;opacity:.85}\n  .tokchip .xbtn:hover svg{opacity:1}\n \n  .eyebrow{\n    font-size:11px;letter-spacing:.14em;color:var(--muted);\n    text-transform:uppercase;margin-bottom:14px;\n  }\n  .sectionhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}\n  .link{font-size:12px;color:#5b5b5b;text-decoration:underline;background:none;border:none;cursor:pointer;padding:0}\n \n  .tops{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-bottom:26px}\n  .top .thumb{background:#fff;height:150px;display:grid;place-items:center;margin-bottom:12px}\n  .top .thumb span{font-size:34px;opacity:.55}\n  .top .nm{font-size:13px;margin-bottom:8px}\n  .top .pr{font-size:13px}\n  .top:hover .thumb{outline:1px solid var(--line)}\n \n  .recent{list-style:none;margin-bottom:26px}\n  .recent li{\n    display:flex;align-items:center;gap:12px;padding:8px 0;font-size:14px;\n  }\n  .recent li .x{margin-left:auto;color:var(--muted);background:none;border:none;cursor:pointer;font-size:14px}\n  .recent li .t{cursor:pointer}\n  .recent li .t:hover{text-decoration:underline}\n \n  .subhead{font-size:16px;margin-bottom:14px;font-weight:400}\n  .chiprow{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:26px}\n  .chip{\n    border:1px solid var(--line);background:#fff;border-radius:999px;\n    padding:9px 16px;font-size:13px;display:inline-flex;align-items:center;gap:9px;\n    transition:border-color .15s,background .15s;\n  }\n  .chip:hover{border-color:#b9b3ab}\n  .chip .plus{display:inline-flex;align-items:center}\n  .chip .plus svg{width:9px;height:9px}\n  .chip.active{background:var(--black);color:#fff;border-color:var(--black)}\n  .chip.active .plus svg path{stroke:#fff}\n  .chip .chip-cnt{color:#5b5b5b;font-size:12px}\n  .chip.active .chip-cnt{color:rgba(255,255,255,.7)}\n \n  /* Chip-Gruppen mit vertikalem Trenner */\n  .chipgroups{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:26px}\n  .chipgroup{display:flex;flex-wrap:wrap;gap:12px}\n  .chip-separator{\n    width:1px;height:28px;background:#c8c4bf;flex:none;\n  }\n \n  .cta{\n    width:100%;background:var(--black);color:#fff;border-radius:999px;\n    padding:19px;font-size:14px;letter-spacing:.12em;text-transform:uppercase;\n    margin-bottom:26px;\n  }\n  .cta:hover{background:#222}\n \n  .themes{display:flex;gap:16px}\n  .theme{width:250px}\n  .theme .img{height:130px;background:#ddd8d1;margin-bottom:8px}\n  .theme .cap{font-size:11px;line-height:1.4;color:#4a4a4a}\n \n  /* ---------- Page ---------- */\n  main{max-width:1180px;margin:0 auto;padding:22px 22px 90px}\n  .crumbs{font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:46px}\n  h1{\n    font-size:40px;font-weight:300;letter-spacing:.22em;\n    text-transform:uppercase;margin-bottom:14px;\n  }\n  .lede{font-size:17px;font-weight:300;letter-spacing:.05em;color:#3c3c3c;margin-bottom:38px}\n \n  .cats{display:flex;gap:16px;margin-bottom:44px;flex-wrap:wrap}\n  .cat{width:132px;cursor:pointer}\n  .cat .img{height:66px;background:#efece7;display:grid;place-items:center}\n  .cat .img svg{width:52px;height:42px;color:#3d3d3d}\n  .cat .nm{\n    background:#fff;border:1px solid var(--line);border-top:none;\n    font-size:9px;letter-spacing:.1em;text-transform:uppercase;\n    text-align:center;padding:9px 4px;\n  }\n  .cat:hover .nm{background:#faf8f6}\n \n  .fbar{display:flex;align-items:center;gap:16px;margin-bottom:12px;flex-wrap:wrap}\n  .toggle{\n    font-size:11px;letter-spacing:.11em;text-transform:uppercase;\n    display:inline-flex;align-items:center;gap:12px;\n    background:none;border:none;cursor:pointer;padding:11px 0;\n  }\n  .toggle .filter-icon{\n    display:inline-flex;align-items:center;justify-content:center;\n    width:28px;height:28px;\n  }\n  .toggle .filter-icon svg{width:22px;height:22px;color:#1a1a1a}\n  .toggle .toggle-text{\n    border-bottom:1px solid var(--gold);padding-bottom:4px;\n    display:inline-flex;align-items:center;gap:10px;\n  }\n \n  .allfilters{margin-bottom:34px}\n  .allfilters[hidden]{display:none}\n  .ftitle{font-size:12px;letter-spacing:.13em;text-transform:uppercase;margin-bottom:14px}\n  .fchips{display:flex;flex-wrap:wrap;gap:12px;position:relative}\n  .fchip{\n    border:1px solid var(--line);background:#fff;\n    padding:14px 20px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;\n    display:inline-flex;align-items:center;gap:12px;cursor:pointer;\n  }\n  .fchip:hover{border-color:#b9b3ab}\n  .fchip.open{background:var(--gold-soft);border-color:var(--gold)}\n  .fchip.hasactive{background:var(--gold-soft);border-color:var(--gold)}\n  .fchip .cnt{\n    background:var(--black);color:#fff;border-radius:999px;\n    font-size:10px;padding:2px 7px;letter-spacing:.02em;\n  }\n \n  .dropdown{\n    position:absolute;top:100%;margin-top:10px;z-index:30;\n    background:#fff;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.09);\n    width:330px;padding:16px 0 0;\n  }\n  .dropdown .dh{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);padding:0 18px 12px}\n  .opt{\n    display:flex;align-items:center;gap:12px;padding:11px 18px;font-size:13px;width:100%;text-align:left;\n    background:none;border:none;cursor:pointer;\n  }\n  .opt:hover{background:#faf8f6}\n  .opt .box{\n    width:16px;height:16px;border:1px solid #b9b3ab;flex:none;\n    display:grid;place-items:center;\n  }\n  .opt .box svg{width:8px;height:8px;opacity:0}\n  .opt.on .box{background:var(--gold);border-color:var(--gold)}\n  .opt.on .box svg{opacity:1}\n  .opt .cnt{margin-left:auto;font-size:11px;color:var(--muted)}\n  .dfoot{\n    display:flex;align-items:center;justify-content:space-between;\n    padding:14px 18px;border-top:1px solid var(--line);margin-top:10px;\n  }\n  .dfoot .reset{font-size:12px;text-decoration:underline;color:#5b5b5b;background:none;border:none;cursor:pointer}\n  .dfoot .apply{background:var(--black);color:#fff;border-radius:999px;padding:11px 20px;font-size:12px;border:none;cursor:pointer}\n \n  .filter-bar{\n    display:flex;align-items:center;\n    margin-top:20px;margin-bottom:14px;\n  }\n  .meta{\n    display:flex;align-items:center;justify-content:space-between;\n    margin-bottom:22px;\n  }\n  .count{font-size:13px}\n  .meta-left{display:flex;align-items:center;gap:12px;flex-wrap:wrap}\n  .activechips{display:flex;align-items:center;gap:8px;flex-wrap:wrap}\n  .actchip{background:#eef0f2;border:none;border-radius:999px;padding:7px 13px;font-size:12px;color:#2a2a2a;display:inline-flex;align-items:center;gap:8px;font-family:inherit}\n  .actchip .x{cursor:pointer;color:#7a7a7a;font-size:13px;line-height:1}\n  .actchip .x:hover{color:#111}\n  .actclear{background:none;border:none;color:#000;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;padding:2px 4px}\n  .actclear:hover{text-decoration:underline}\n  .sort{position:relative;margin-left:auto}\n  .sortbtn{\n    border:1px solid var(--line);padding:11px 16px;font-size:13px;background:#fff;\n    display:inline-flex;align-items:center;gap:14px;cursor:pointer;\n    min-width:240px;justify-content:space-between;font-family:inherit;\n  }\n  .sortbtn:hover{border-color:#b9b3ab}\n  .sortbtn .caret{display:inline-flex;align-items:center;transition:transform .15s}\n  .sort.open .sortbtn .caret{transform:rotate(180deg)}\n  .sortmenu{\n    position:absolute;top:calc(100% + 4px);right:0;\n    background:#fff;border:1px solid var(--line);\n    box-shadow:0 8px 24px rgba(0,0,0,.09);\n    z-index:25;min-width:240px;padding:6px 0;\n  }\n  .sortmenu[hidden]{display:none}\n  .sortmenu button{\n    display:block;width:100%;text-align:left;\n    padding:11px 16px;font-size:13px;\n    border:none;background:none;cursor:pointer;font-family:inherit;\n  }\n  .sortmenu button:hover{background:#faf8f6}\n  .sortmenu button.on{background:var(--gold-soft);font-weight:600}\n \n  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}\n  .card{border:1px solid var(--line);background:#fff;padding:22px;position:relative;display:flex;flex-direction:column;min-width:0}\n  .card-body{flex:1 0 auto;display:flex;flex-direction:column}\n  .card-footer{margin-top:auto;padding-top:14px}\n  .flag{\n    position:absolute;top:18px;left:0;background:#98a6b2;color:#fff;\n    font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:6px 14px;\n  }\n  .flag-sale{background:#c1272d}\n  .flag-excl{background:#111}\n  .price-sale{color:#c1272d}\n  .pricecol{display:flex;flex-direction:column;gap:3px}\n  .pricerow{display:flex;align-items:center;gap:10px}\n  .savebadge{background:#c1272d;color:#fff;font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 8px;text-transform:uppercase;white-space:nowrap}\n  .best30{font-size:12px;color:#6a6a6a;font-style:italic}\n  .stock.soldout{color:#b3402f;font-weight:600}\n  .cardtools{position:absolute;top:16px;right:18px;display:flex;gap:10px;align-items:center;z-index:2}\n  .bagbtn{position:relative;background:none;border:none;padding:0;cursor:pointer;line-height:0}\n  .tool-badge{position:absolute;right:-4px;bottom:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:#cdb96a;color:#1a1a1a;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;box-sizing:border-box}\n  .bagbtn svg{width:38px;height:38px;display:block}\n  .bagbtn:hover circle{fill:#dfd29a}\n  .bellbtn{position:relative;background:none;border:none;padding:0;cursor:pointer;line-height:0}\n  .bellbtn svg{width:38px;height:38px;display:block}\n  .bellbtn:hover circle{fill:#dfd29a}\n  .rem-pop{position:fixed;z-index:130;display:none;background:#fff;border:1px solid #e2e2e2;box-shadow:0 10px 34px rgba(0,0,0,.16);padding:22px 22px 20px;width:440px;max-width:calc(100vw - 40px)}\n  .rem-pop.show{display:block}\n  .rem-pop .wt-close{position:absolute;top:12px;right:14px;background:none;border:none;font-size:20px;color:#9aa1a1;cursor:pointer;line-height:1;padding:2px}\n  .rem-pop .wt-close:hover{color:#333}\n  .rem-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}\n  .rem-head .wt-heart{color:#2e7d70;font-size:26px;line-height:1;flex:0 0 auto}\n  .rem-text{font-size:14px;color:#3a4a4a;line-height:1.4;margin:0;padding-right:22px}\n  .rem-form{display:flex;gap:10px}\n  .rem-input{flex:1;min-width:0;border:1px solid #c9c9c9;padding:11px 12px;font-size:14px;font-family:inherit}\n  .rem-input:focus{outline:none;border-color:#1a1a1a}\n  .rem-cta{background:#1a1a1a;color:#fff;border:none;padding:11px 18px;font:700 12px/1 'Helvetica Neue',Arial;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;white-space:nowrap}\n  .rem-cta:hover{background:#333}\n  .fav{\n    width:38px;height:38px;\n    display:inline-flex;align-items:center;justify-content:center;\n    background:none;border:none;cursor:pointer;padding:0;\n    color:#333;font-size:17px;\n  }\n  .fav{position:relative;height:38px}\n  .fav svg{width:23px;height:23px;display:block}\n  .fav:hover circle{fill:#dfd29a}\n  .fav.on{color:#111}\n  .fav .fav-ic{width:38px;height:38px;display:block}\n  .fav .fav-bg{fill:none}\n  .fav .fav-heart{fill:#fff;stroke:#222;stroke-width:1.7;stroke-linejoin:round;transition:fill .2s ease,stroke .2s ease}\n  .fav:hover .fav-heart{stroke:#000}\n  .fav.on .fav-heart{fill:#111;stroke:#111}\n  .shotwrap{position:relative;height:240px;margin:30px 0 16px;overflow:hidden;touch-action:pan-y;cursor:grab;user-select:none}\n  .spin360{position:absolute;right:8px;bottom:8px;width:34px;height:34px;border:none;background:none;padding:0;cursor:pointer;z-index:3;line-height:0}\n  .spin360 svg{width:34px;height:34px;display:block}\n  .spin360:hover{filter:brightness(.95)}\n  .spin360 .ic-stop{display:none}\n  .spin360.on .ic-play{display:none}\n  .spin360.on .ic-stop{display:block}\n  @keyframes spin360{from{transform:rotate(0)}to{transform:rotate(360deg)}}\n  .shotwrap.spinning .shot-slide svg.shot,.shotwrap.spinning .shot-slide .shot-real-img{animation:spin360 2.4s linear infinite;transform-origin:50% 50%}\n  .shotwrap:active{cursor:grabbing}\n  .shot-track{display:flex;height:100%;will "profiresist\"){\n      return p.size===\"24\"\n        ? REAL_PRODUCT_IMAGES.profiresist_24\n        : REAL_PRODUCT_IMAGES.profiresist_28;\n    }\n\n    if(p.id===\"devilschmor\") return REAL_PRODUCT_IMAGES.devilschmor;\n\n    if(p.id===\"fusiontec\"){\n      const colorMap = {\n        silver:REAL_PRODUCT_IMAGES.fusion_silver,\n        blue:REAL_PRODUCT_IMAGES.fusion_blue,\n        black:REAL_PRODUCT_IMAGES.fusion_black,\n        red:REAL_PRODUCT_IMAGES.fusion_red\n      };\n      return colorMap[p.activeColor] || colorMap.black;\n    }\n\n    if(p.id===\"calabria\") return REAL_PRODUCT_IMAGES.calabria;\n    if(p.id===\"permadur\") return REAL_PRODUCT_IMAGES.permadur;\n\n    return \"\";\n  }\n\n  function secondaryGalleryMarkup(p){\n    const secondMarkup = p.id===\"durado\" && REAL_PRODUCT_IMAGES.durado_mood\n      ? `<div class=\"shot-slide\"><div class=\"shot-real-img\" style=\"background-image:url(${REAL_PRODUCT_IMAGES.durado_mood})\" role=\"img\" aria-label=\"${p.brand} Moodbild\"><\u002Fdiv><\u002Fdiv>`\n      : `<div class=\"shot-slide\"><div class=\"moodimg\"><span class=\"mood-plate\"><\u002Fspan><svg class=\"mood-cut ${shotColorClass(p)}\" viewBox=\"0 0 120 100\" style=\"width:66px;height:50px\"><use href=\"#i-pan\"/><\u002Fsvg><\u002Fdiv><\u002Fdiv>`;\n    return `${secondMarkup}\n      <div class=\"shot-slide\"><svg class=\"shot ${shotColorClass(p)}\" viewBox=\"0 0 140 100\" style=\"width:132px;height:90px\"><use href=\"#i-panset\"/><\u002Fsvg><\u002Fdiv>`;\n  }\n\n  function gallerySlidesMarkup(p){\n    const first=primaryProductImage(p);\n    if(!first) return fallbackGalleryMarkup(p);\n    return `<div class=\"shot-slide\"><div class=\"shot-real-img\" style=\"background-image:url(${first})\" role=\"img\" aria-label=\"${p.brand} ${variantText(p)}\"><\u002Fdiv><\u002Fdiv>${secondaryGalleryMarkup(p)}`;\n  }\n\n  function favIconMarkup(){\n    return `<svg class=\"fav-ic\" viewBox=\"0 0 38 38\" aria-hidden=\"true\"><path class=\"fav-heart\" d=\"M19 26.1c-.7-.4-2.2-1.5-3.8-3-2.7-2.6-5.6-6-5.6-10.1 0-3.3 2.5-5.8 5.7-5.8 1.8 0 3.3.8 4.2 2.1.9-1.3 2.4-2.1 4.2-2.1 3.3 0 5.8 2.5 5.8 5.8 0 4.1-2.9 7.5-5.6 10.1-1.6 1.5-3.1 2.6-3.9 3Z\"/><\u002Fsvg>`;\n  }\n\n  function compareThumbMarkup(p){\n    const src = primaryProductImage(p);\n    if(src) return `<img class=\"cmp-thumb-img\" src=\"${src}\" alt=\"${p.brand}\" loading=\"lazy\">`;\n    return `<div class=\"cmp-thumb\"><svg class=\"${shotColorClass(p)}\" viewBox=\"0 0 120 100\" width=\"86\" height=\"62\"><use href=\"#i-${p.set?'panset':'pan'}\"/><\u002Fsvg><\u002Fdiv>`;\n  }\n\n  function compareActionsMarkup(p){\n    const secondary = p.soldout\n      ? `<button class=\"cmp-cta secondary cmp-link-remind\" data-id=\"${p.id}\" type=\"button\">Erinnere mich<\u002Fbutton>`\n      : `<button class=\"cmp-cta secondary cmp-link-cart\" data-id=\"${p.id}\" type=\"button\">Zum Warenkorb<\u002Fbutton>`;\n    return `<div class=\"cmp-cta-row\"><button class=\"cmp-cta cmp-link-product\" data-id=\"${p.id}\" type=\"button\">Zum Produkt<\u002Fbutton>${secondary}<\u002Fdiv>`;\n  }\n\n  function sortProducts(list){\n    const arr = list.slice();\n    switch(state.sort){\n      case \"price-asc\":  arr.sort((a,b)=>price(a)-price(b)); break;\n      case \"price-desc\": arr.sort((a,b)=>price(b)-price(a)); break;\n      case \"sale\":       arr.sort((a,b)=>(b.sale?1:0)-(a.sale?1:0)); break;\n      case \"new\":        arr.sort((a,b)=>(b.isNew?1:0)-(a.isNew?1:0)); break;\n      case \"rating\":     arr.sort((a,b)=>b.rating-a.rating); break;\n      default: /* popular = Original-Reihenfolge */\n    }\n    return arr;\n  }\n \n  const $ = s=>document.querySelector(s);\n  const q=$(\"#q\"), scrim=$(\"#scrim\"), suggest=$(\"#suggest\");\n \n  /* ============ 3-Zustand-Overlay ============\n     Zustand 1 \u2013 Default:  kein Text, nur Fokus\n     Zustand 2 \u2013 Generisch: 1 Token (z.B. \"Bestecke\")\n     Zustand 3 \u2013 Spezifisch: \u22652 Tokens (z.B. \"Besteck-Sets + Bis 12 Personen + sp\u00fclmaschinenfest\")\n  ============================================ */\n \n  function showOnly(id){\n    [\"stateDefault\",\"stateGeneric\",\"stateSpecific\"].forEach(s=>{\n      document.getElementById(s).hidden = (s!==id);\n    });\n  }\n \n  function openSuggest(){ suggest.classList.add(\"on\"); scrim.classList.add(\"on\"); renderOverlay(); }\n  function closeSuggest(){ suggest.classList.remove(\"on\"); scrim.classList.remove(\"on\"); }\n \n  q.addEventListener(\"focus\", openSuggest);\n  scrim.addEventListener(\"click\", closeSuggest);\n  document.addEventListener(\"keydown\", e=>{ if(e.key===\"Escape\"){ closeSuggest(); closeDropdown(); }});\n \n  $(\"#clearq\").addEventListener(\"click\", ()=>{\n    if(q.value || state.tokens.length){\n      q.value=\"\"; state.query=\"\"; state.tokens=[];\n      renderOverlay(); q.focus();\n    } else {\n      closeSuggest(); q.blur();\n    }\n  });\n \n  q.addEventListener(\"input\", ()=>{\n    state.query = q.value.trim();\n    state.tokens = parse(state.query);\n    renderOverlay();\n  });\n \n  /* AI-Hint \u2192 spezifische Query einf\u00fcllen */\n  $(\"#aihint\").addEventListener(\"click\", ()=>{\n    q.value = \"Bestecke f\u00fcr 12 Personen, sp\u00fclmaschinenfest\";\n    state.query = q.value;\n    state.tokens = parse(state.query);\n    renderOverlay();\n  });\n \n  /* Letzte Suchen: l\u00f6schen + klickbar */\n  $(\"#clearRecent\").addEventListener(\"click\", ()=>{ $(\"#recentList\").innerHTML=\"\"; });\n  document.querySelectorAll(\"#recentList .x\").forEach(b=>{\n    b.addEventListener(\"click\", ()=> b.parentElement.remove());\n  });\n \n  /* Default-State: alle .t und .chip[data-fill] f\u00fcllen das Suchfeld */\n  document.querySelectorAll(\"#stateDefault .t[data-fill], #stateDefault .chip[data-fill]\").forEach(el=>{\n    el.addEventListener(\"click\", ()=>{\n      q.value = el.dataset.fill;\n      state.query = q.value;\n      state.tokens = parse(state.query);\n      renderOverlay();\n    });\n  });\n \n  /* Generisch-State: Chip-Klicks f\u00fcgen Token hinzu */\n  document.querySelectorAll(\"#stateGeneric .sug-chip\").forEach(b=>{\n    b.addEventListener(\"click\", ()=>{\n      const v = b.dataset.add;\n      if(!state.tokens.includes(v)) state.tokens.push(v);\n      // Wenn ein zweiter Chip hinzugef\u00fcgt wird \u2192 wechsel zu spezifisch\n      renderOverlay();\n    });\n  });\n \n  /* Generic-Remove-Button */\n  document.getElementById(\"genericRemove\").addEventListener(\"click\", ()=>{\n    q.value=\"\"; state.query=\"\"; state.tokens=[];\n    renderOverlay();\n  });\n \n  /* Spezifisch-State: Chips */\n  document.querySelectorAll(\"#stateSpecific .sug-chip\").forEach(b=>{\n    b.addEventListener(\"click\", ()=>{\n      const v = b.dataset.add;\n      if(!state.tokens.includes(v)) state.tokens.push(v);\n      renderOverlay();\n    });\n  });\n \n  /* NLP-Parser: Text \u2192 Token-Array */\n  /* NLP-Parser: Text \u2192 Token-Array\n     Chips erst wenn ganze W\u00f6rter ausgeschrieben sind:\n     - \"bestecke\" (mit e) \u2192 Bestecke\n     - \"12 Personen\" komplett \u2192 Bis 12 Personen\n     - \"6 Personen\" komplett \u2192 Bis 6 Personen\n     - \"sp\u00fclmaschinenfest\" komplett \u2192 Sp\u00fclmaschinenfest\n     - \"cromargan protect\" \u2192 Cromargan protect\u00ae */\n  function parse(text){\n    const t = text.toLowerCase();\n    if(!t) return [];\n    const out=[];\n \n    const hasBestecke = /\\bbesteck/.test(t);\n    const has12Pers   = /\\b12 personen\\b/.test(t) || /\\bzw\u00f6lf personen\\b/.test(t);\n    const has6Pers    = /\\b6 personen\\b/.test(t)  || /\\bsechs personen\\b/.test(t);\n    const hasSpuel    = /\\bsp\u00fclmaschinenfest\\b/.test(t);\n    const hasCromProt = /\\bcromargan protect\\b/.test(t);\n \n    if(hasBestecke){\n      // Mit weiteren spezifischen Angaben \u2192 Besteck-Sets (statt allgemeiner \"Bestecke\")\n      if(has12Pers || has6Pers || hasSpuel) out.push(\"Besteck-Set\");\n      else out.push(\"Bestecke\");\n    }\n    if(has12Pers)   out.push(\"F\u00fcr 12 Personen\");\n    if(has6Pers)    out.push(\"F\u00fcr 6 Personen\");\n    if(hasSpuel)    out.push(\"Sp\u00fclmaschinenfest\");\n    if(hasCromProt) out.push(\"Cromargan protect\u00ae\");\n \n    return out;   // kein Fallback: unvollst\u00e4ndige W\u00f6rter \u2192 keine Chips\n  }\n \n  function countForTokens(toks){\n    if(!toks.length) return 267;\n    const has=v=>toks.includes(v);\n    const bs=has(\"Besteck-Set\"), p12=has(\"F\u00fcr 12 Personen\"), p6=has(\"F\u00fcr 6 Personen\"), sp=has(\"Sp\u00fclmaschinenfest\");\n    if(bs&&p12&&sp) return 20;\n    if(bs&&p6&&sp) return 24;\n    if(bs&&p12) return 59;\n    if(bs&&p6) return 62;\n    if(bs) return 121;\n    if(toks.length===1 && toks[0]===\"Bestecke\") return 267;\n    const cc={\"Sp\u00fclmaschinenfest\":67,\"Cromargan protect\u00ae\":67,\"Kinderbesteck\":12,\"Silber / versilbert\":20,\"Poliert\":176,\"F\u00fcr 6 Personen\":62,\"F\u00fcr 12 Personen\":59,\"Besteck-Set\":121,\"Bestecke\":267};\n    const vals=toks.map(t=>cc[t]).filter(x=>x!=null);\n    return vals.length? Math.min(...vals) : 267;\n  }\n\n  /* Zustand ermitteln und rendern */\n  function renderOverlay(){\n    if(!state.tokens.length){\n      showOnly(\"stateDefault\");\n      return;\n    }\n    if(state.tokens.length === 1){\n      showOnly(\"stateGeneric\");\n      $(\"#showResultsGeneric\").textContent = countForTokens(state.tokens)+\" Ergebnisse anzeigen\";\n      return;\n    }\n    // \u22652 Tokens \u2192 spezifisch\n    showOnly(\"stateSpecific\");\n    $(\"#showResultsSpecific\").textContent = countForTokens(state.tokens)+\" Ergebnisse anzeigen\";\n    // Verstanden-Chips dynamisch rendern\n    const tokEl = $(\"#tokens\");\n    tokEl.innerHTML = state.tokens.map((t,i)=>\n      `<span class=\"tokchip\">${t}<button class=\"xbtn\" data-i=\"${i}\" aria-label=\"${t} entfernen\"><svg style=\"color:#fff\"><use href=\"#i-close\"/><\u002Fsvg><\u002Fbutton><\u002Fspan>`\n    ).join(\"\");\n    tokEl.querySelectorAll(\".xbtn\").forEach(b=>{\n      b.addEventListener(\"click\", ()=>{\n        state.tokens.splice(+b.dataset.i, 1);\n        if(!state.tokens.length){ q.value=\"\"; state.query=\"\"; }\n        renderOverlay();\n      });\n    });\n  }\n \n  /* \u2500\u2500 Ergebnisse anzeigen (generisch) \u2500\u2500 */\n  $(\"#showResultsGeneric\").addEventListener(\"click\", ()=>{\n    Object.values(state.filters).forEach(s=>s.clear());\n    // Generisch: Besteck-Sets als Kategorie vorausw\u00e4hlen\n    state.filters.prodart.add(\"Besteck-Set\");\n    syncChipsFromFilters();\n    closeSuggest();\n    paintPLP();\n    window.scrollTo({top:0,behavior:\"smooth\"});\n  });\n \n  /* \u2500\u2500 Ergebnisse anzeigen (spezifisch) \u2500\u2500 */\n  $(\"#showResultsSpecific\").addEventListener(\"click\", ()=>{\n    Object.values(state.filters).forEach(s=>s.clear());\n    state.tokens.forEach(t=>{\n      if(CHIP_MAP[t]) CHIP_MAP[t].opts.forEach(o=>state.filters[CHIP_MAP[t].filter].add(o));\n      if(t===\"Sp\u00fclmaschinenfest\") state.filters.spuel.add(\"Sp\u00fclmaschinenfest\");\n    });\n    syncChipsFromFilters();\n    closeSuggest();\n    paintPLP();\n    window.scrollTo({top:0,behavior:\"smooth\"});\n  });\n \n  /* ============ PLP: Chips \u2194 Filter Sync ============ */\n  const plpChips = $(\"#plpChips\");\n \n  function toggleChip(chipLabel){\n    const map = CHIP_MAP[chipLabel];\n    if(!map){ return; } // nicht gemappt \u2192 nichts tun (Placeholder-Chip)\n    const set = state.filters[map.filter];\n    const on = state.popularSel.has(chipLabel);\n    if(on){\n      state.popularSel.delete(chipLabel);\n      map.opts.forEach(o=>set.delete(o));\n    } else {\n      state.popularSel.add(chipLabel);\n      map.opts.forEach(o=>set.add(o));\n    }\n    paintPLP();\n    // Falls das entsprechende Dropdown gerade offen ist: neu zeichnen\n    if(state.openFilter === map.filter) paintDropdown(FILTERS[map.filter], map.filter);\n  }\n \n  function toggleOption(key, opt){\n    const set = state.filters[key];\n    set.has(opt) ? set.delete(opt) : set.add(opt);\n    syncChipsFromFilters();\n    paintDropdown(FILTERS[key], key);\n    paintPLP();\n  }\n \n  /* Ableitung: aktive Chips = \"mindestens eine Option des Chip-Mappings ist an\" */\n  function syncChipsFromFilters(){\n    state.plpActive.clear();\n    Object.entries(CHIP_MAP).forEach(([chip, m])=>{\n      const anyOn = m.opts.some(o => state.filters[m.filter].has(o));\n      if(anyOn) state.plpActive.add(chip);\n    });\n  }\n \n  function paintChips(){\n    const chipHtml = c => {\n      const on = state.popularSel.has(c);\n      const cnt = CHIP_COUNTS[c];\n      const suffix = on\n        ? `<span class=\"plus\"><svg style=\"color:#fff\"><use href=\"#i-close\"/><\u002Fsvg><\u002Fspan>`\n        : (cnt !== undefined\n            ? `<span class=\"chip-cnt\">(${cnt})<\u002Fspan>`\n            : `<span class=\"plus\"><svg><use href=\"#i-plus\"/><\u002Fsvg><\u002Fspan>`);\n      const label = c===\"28 cm\" ? diameterDisplay(c) : c;\n      return `<button class=\"chip ${on?\"active\":\"\"}\" data-c=\"${c}\">${label} ${suffix}<\u002Fbutton>`;\n    };\n    plpChips.innerHTML =\n      `<div class=\"chipgroup\">${POPULAR_KATEGORIEN.map(chipHtml).join(\"\")}<\u002Fdiv>` +\n      `<div class=\"chip-separator\"><\u002Fdiv>` +\n      `<div class=\"chipgroup\">${POPULAR_ATTRIBUTE.map(chipHtml).join(\"\")}<\u002Fdiv>`;\n    plpChips.querySelectorAll(\".chip\").forEach(b=>{\n      b.addEventListener(\"click\", ()=> toggleChip(b.dataset.c));\n    });\n  }\n \n  /* ============ Filter-Chips (Alle Filter) ============ */\n  const dropdown = $(\"#dropdown\");\n  function closeDropdown(){\n    state.openFilter=null; dropdown.hidden=true;\n    document.querySelectorAll(\".fchip\").forEach(c=>c.classList.remove(\"open\"));\n  }\n \n  function paintFilterChips(){\n    document.querySelectorAll(\".fchip\").forEach(chip=>{\n      const key = chip.dataset.f;\n      const activeCount = state.filters[key] ? state.filters[key].size : 0;\n      chip.classList.toggle(\"hasactive\", activeCount>0 && state.openFilter!==key);\n      // Z\u00e4hler anzeigen wenn aktiv\n      const label = chip.childNodes[0].nodeValue.replace(/\\s+$/,'');\n      const plusSpan = chip.querySelector(\".plus\");\n      if(activeCount>0){\n        if(!chip.querySelector(\".cnt\")){\n          const s=document.createElement(\"span\");\n          s.className=\"cnt\"; s.textContent=activeCount;\n          chip.insertBefore(s, plusSpan);\n        } else {\n          chip.querySelector(\".cnt\").textContent = activeCount;\n        }\n      } else {\n        const c = chip.querySelector(\".cnt\"); if(c) c.remove();\n      }\n    });\n  }\n \n  document.querySelectorAll(\".fchip\").forEach(chip=>{\n    chip.addEventListener(\"click\", (e)=>{\n      e.stopPropagation();\n      const key = chip.dataset.f;\n      if(state.openFilter===key){ closeDropdown(); paintFilterChips(); return; }\n      closeDropdown();\n      const cfg = FILTERS[key];\n      if(!cfg){ paintFilterChips(); return; }   // nur belegte Filter \u00f6ffnen\n      state.openFilter=key;\n      chip.classList.add(\"open\");\n      dropdown.hidden=false;\n      dropdown.style.left = (chip.offsetLeft) + \"px\";\n      dropdown.style.top  = (chip.offsetTop + chip.offsetHeight) + \"px\";\n      paintDropdown(cfg,key);\n      paintFilterChips();\n    });\n  });\n  document.addEventListener(\"click\", (e)=>{ if(!dropdown.contains(e.target)){ closeDropdown(); paintFilterChips(); } });\n \n  function paintDropdown(cfg,key){\n    const sel = state.filters[key];\n    dropdown.innerHTML = `\n      <div class=\"dh\">${cfg.title}<\u002Fdiv>\n      ${cfg.opts.map(o=>`\n        <button class=\"opt ${sel.has(o.l)?\"on\":\"\"}\" data-o=\"${o.l}\">\n          <span class=\"box\"><svg><use href=\"#i-check\"/><\u002Fsvg><\u002Fspan>\n          <span>${key===\"setgr\" ? diameterDisplay(o.l) : o.l}<\u002Fspan>\n          <span class=\"cnt\">${o.c}<\u002Fspan>\n        <\u002Fbutton>`).join(\"\")}\n      <div class=\"dfoot\">\n        <button class=\"reset\">Zur\u00fccksetzen<\u002Fbutton>\n        <button class=\"apply\">${total()} Artikel anzeigen<\u002Fbutton>\n      <\u002Fdiv>`;\n \n    dropdown.querySelectorAll(\".opt\").forEach(o=>{\n      o.addEventListener(\"click\", ()=> toggleOption(key, o.dataset.o));\n    });\n    dropdown.querySelector(\".reset\").addEventListener(\"click\", ()=>{\n      state.filters[key].clear();\n      syncChipsFromFilters();\n      paintDropdown(cfg,key); paintPLP();\n    });\n    dropdown.querySelector(\".apply\").addEventListener(\"click\", ()=>{ closeDropdown(); paintFilterChips(); });\n  }\n \n  /* ============ Produkt-Filterung ============ */\n  function visible(){\n    const F = state.filters;\n    return products.filter(p=>{\n      if(F.prodart.size){\n        let ok=false;\n        if(F.prodart.has(\"Pfannen-Set\") && p.set) ok=true;\n        if(F.prodart.has(\"Bratpfanne\") && (p.art===\"brat\"||p.art===\"set\")) ok=true;\n        if(F.prodart.has(\"Schmorpfanne\") && p.art===\"schmor\") ok=true;\n        if(F.prodart.has(\"Servierpfanne\") && p.art===\"schmor\") ok=true;\n        if(!ok) return false;\n      }\n      if(F.setgr.size){\n        const ok=[...F.setgr].some(v=>{ const cm=v.replace(\" cm\",\"\"); return p.diams.some(d=>d.d.split(\"\u00b7\").includes(cm)); });\n        if(!ok) return false;\n      }\n      if(F.mat.size){\n        let ok=false;\n        if(F.mat.has(\"Edelstahl\") && /edelstahl/i.test(p.material)) ok=true;\n        if(F.mat.has(\"Aluminium\") && /aluminium/i.test(p.material)) ok=true;\n        if(F.mat.has(\"Gusseisen\") && /guss/i.test(p.material)) ok=true;\n        if(!ok) return false;\n      }\n      if(F.ober.size){\n        let ok=false;\n        if(F.ober.has(\"Antihaft\") && /antihaft/i.test(p.coating)) ok=true;\n        if(F.ober.has(\"Keramik\") && /keramik/i.test(p.coating)) ok=true;\n        if(F.ober.has(\"Edelstahl (unbeschichtet)\") && /unbeschichtet/i.test(p.coating)) ok=true;\n        if(!ok) return false;\n      }\n      if(F.serie.size){\n        const ok=[...F.serie].some(v=>p.brand.toLowerCase().includes(v.toLowerCase()) || v.toLowerCase().includes(p.brand.toLowerCase()));\n        if(!ok) return false;\n      }\n      if(F.farbe.size){\n        const ok=(p.colors||[]).some(c=>F.farbe.has(c.label));\n        if(!ok) return false;\n      }\n      return true;\n    });\n  }\n\n    /* Simulierte Gesamtanzahl (Katalog-Niveau) */\n  function total(){\n    const F = state.filters;\n    const anyActive = Object.values(F).some(s=>s.size>0);\n    if(!anyActive) return 214;\n    const cnt = Object.values(F).reduce((s,set)=>s+set.size,0);\n    return Math.max(6, 214 - cnt*28);\n  }\n\n    function paintCount(){\n    const n = total();\n    const anyActive = Object.values(state.filters).some(s=>s.size>0);\n    $(\"#count\").textContent = anyActive ? `${n} passende Artikel` : `${n} Artikel`;\n  }\n \n  function paintGrid(){\n    const list = sortProducts(visible());\n    const grid = $(\"#grid\");\n    if(!list.length){\n      grid.innerHTML = `<div class=\"empty\">Keine Artikel f\u00fcr diese Auswahl. Filter anpassen oder zur\u00fccksetzen.<\u002Fdiv>`;\n      return;\n    }\n \n    grid.innerHTML = list.map(p=>{\n      const pr = price(p);\n      const colorRow = p.colors ? `\n        <div class=\"colorrow\">\n          <span class=\"lb\">Farbe:<\u002Fspan>\n          ${p.colors.map(c=>`\n            <button class=\"swatch ${c.cls} ${p.activeColor===c.key?\"sel\":\"\"}\" data-id=\"${p.id}\" data-color=\"${c.key}\" title=\"${c.label}\" aria-label=\"${c.label}\"><\u002Fbutton>\n          `).join(\"\")}\n          <span class=\"color-label\">${p.colors.find(c=>c.key===p.activeColor)?.label||\"\"}<\u002Fspan>\n        <\u002Fdiv>` : \"\";\n \n      return `\n      <article class=\"card${state.compare.has(p.id)?' comparing':''}\" data-id=\"${p.id}\">\n        ${p.flag?`<div class=\"flag ${flagClass(p.flag)}\">${p.flag}<\u002Fdiv>`:\"\"}\n        <div class=\"cardtools\">\n          ${p.soldout?`<button class=\"bellbtn\" data-id=\"${p.id}\" aria-label=\"Erinnerung setzen\"><svg viewBox=\"0 0 43 43\"><use href=\"#i-bell\"/><\u002Fsvg><\u002Fbutton>`:`<button class=\"bagbtn\" data-id=\"${p.id}\" aria-label=\"In den Warenkorb\"><svg viewBox=\"0 0 43 43\"><use href=\"#i-kaufen\"/><\u002Fsvg>${p.cartQty?`<span class=\"tool-badge\">${p.cartQty}<\u002Fspan>`:\"\"}<\u002Fbutton>`}\n          <button class=\"fav ${state.fav.has(p.id)?\"on\":\"\"}\" data-fav=\"${p.id}\" aria-label=\"Merken\" aria-pressed=\"${state.fav.has(p.id)?\"true\":\"false\"}\">\n            ${favIconMarkup()}\n          <\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"shotwrap\" data-id=\"${p.id}\" data-idx=\"0\">\n          <div class=\"shot-track\">\n            ${gallerySlidesMarkup(p)}\n          <\u002Fdiv>\n          ${p.id===\"ultimate\"?`<button class=\"spin360\" data-id=\"${p.id}\" aria-label=\"360-Grad-Ansicht starten\"><svg class=\"ic-play\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"12\" fill=\"#cfcac0\"/><path d=\"M9.7 7.4 L16.6 12 L9.7 16.6 Z\" fill=\"#2a2a2a\"/><\u002Fsvg><svg class=\"ic-stop\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"12\" fill=\"#cfcac0\"/><rect x=\"8\" y=\"8\" width=\"8\" height=\"8\" fill=\"#2a2a2a\"/><\u002Fsvg><\u002Fbutton>`:\"\"}\n        <\u002Fdiv>\n        <div class=\"rail\"><div class=\"rail-thumb\"><\u002Fdiv><\u002Fdiv>\n        <div class=\"card-body\">\n          <div class=\"brand\">${p.brand}<\u002Fdiv>\n          <div class=\"kind\">${p.kind}<\u002Fdiv>\n          <div class=\"variant\">${variantText(p)}<\u002Fdiv>\n          <div class=\"incl\">${inclText(p)}<\u002Fdiv>\n          <div class=\"mat\">${p.coating} \u00b7 ${p.material}<br>${p.cooktop}<\u002Fdiv>\n          <div class=\"ideal\"><b>Ideal f\u00fcr:<\u002Fb> ${idealText(p)}<\u002Fdiv>\n          ${p.diams.length>1?`<div class=\"vrow\">\n            <spa      });\n    });\n  }\n \n  /* Einzelne Karte in-place aktualisieren (kein Scroll-Jump) */\n  function paintCard(p){\n    const card = $(\"#grid\").querySelector(`[data-id=\"${p.id}\"]`);\n    if(!card){ paintGrid(); return; }\n    const pr = price(p);\n \n    card.querySelector(\".variant\").textContent = variantText(p);\n    card.querySelector(\".incl\").textContent    = inclText(p);\n    card.querySelector(\".price\").textContent   = priceStr(pr);\n    const _sb=card.querySelector(\".savebadge\"); if(_sb) _sb.textContent = \"Spare \"+savePct(p)+\"%\";\n \n    const wrap=card.querySelector(\".shotwrap\");\n    if(wrap){\n      wrap.dataset.idx=0;\n      const track=wrap.querySelector(\".shot-track\");\n      if(track) track.innerHTML=gallerySlidesMarkup(p);\n      applySlide(wrap,0,0,true);\n    }\n \n    // Gr\u00f6\u00dfen-Chips\n    card.querySelectorAll(\".vchip[data-sz]\").forEach(b=>{\n      b.classList.toggle(\"sel\", b.dataset.sz===p.size);\n    });\n \n    // Farb-Swatches\n    if(p.colors){\n      card.querySelectorAll(\".swatch[data-color]\").forEach(b=>{\n        b.classList.toggle(\"sel\", b.dataset.color===p.activeColor);\n      });\n      const label = card.querySelector(\".color-label\");\n      if(label) label.textContent = p.colors.find(c=>c.key===p.activeColor)?.label||\"\";\n    }\n \n    // Compare-Bar-Slot ebenfalls updaten falls dieses Produkt verglichen wird\n    if(state.compare.has(p.id)) paintCompareBar();\n  }\n \n  /* ============ Sortierung ============ */\n  const sortEl = $(\"#sort\"), sortBtn = $(\"#sortBtn\"), sortMenu = $(\"#sortMenu\"), sortLabel = $(\"#sortLabel\");\n \n  function closeSort(){\n    sortMenu.hidden = true;\n    sortEl.classList.remove(\"open\");\n    sortBtn.setAttribute(\"aria-expanded\",\"false\");\n  }\n  function openSort(){\n    sortMenu.hidden = false;\n    sortEl.classList.add(\"open\");\n    sortBtn.setAttribute(\"aria-expanded\",\"true\");\n    // Aktive Option markieren\n    sortMenu.querySelectorAll( ap.querySelector(\"#actClear\");\n    if(clr) clr.addEventListener(\"click\", ()=>{\n      Object.values(state.filters).forEach(s=>s.clear());\n      { const fn=state.finder; fn.answers={}; fn.path=null; fn.step=0; fn.done=false; }\n      syncChipsFromFilters(); paintPLP(); if(typeof renderFinder===\"function\") renderFinder();\n    });\n  }\n\n  /* \u2500\u2500 Thumbnail-Swipe in Produktkacheln \u2500\u2500 */\n  function applySlide(w, idx, dxPct, animate){\n    const track=w.querySelector('.shot-track');\n    const thumb=w.parentElement.querySelector('.rail-thumb');\n    track.style.transition = animate ? 'transform .3s cubic-bezier(.4,0,.15,1)' : 'none';\n    const base = -idx*100;\n    track.style.transform = 'translateX(calc('+base+'% + '+(dxPct||0)+'px))';\n    if(thumb) thumb.style.left = (idx*33.333)+'%';\n  }\n  (function initSwipe(){\n    let drag=null;\n    document.addEventListener('pointerdown', e=>{\n      const w=e.target.closest('.shotwrap'); if(!w) return;\n      drag={w, x:e.clientX, idx:+(w.dataset.idx||0), moved:false};\n      applySlide(w, drag.idx, 0, false);\n    });\n    document.addEventListener('pointermove', e=>{\n      if(!drag) return;\n      const dx=e.clientX-drag.x; if(Math.abs(dx)>4) drag.moved=true;\n      applySlide(drag.w, drag.idx, dx, false);\n    });\n    function end(e){\n      if(!drag) return;\n      const dx=(e.clientX||drag.x)-drag.x; const th=40;\n      let idx=drag.idx;\n      if(dx<=-th) idx=Math.min(2, idx+1);\n      else if(dx>=th) idx=Math.max(0, idx-1);\n      drag.w.dataset.idx=idx;\n      applySlide(drag.w, idx, 0, true);\n      drag=null;\n    }\n    document.addEventListener('pointerup', end);\n    document.addEventListener('pointercancel', end);\n  })();\n\n  function paintPLP(){ paintChips(); paintFilterChips(); paintGrid(); paintCount(); paintActiveChips(); }\n\n  /* Gallery Peek Preview \u2013 einmaliger Swipe-Hinweis auf der ersten Kachel (Mobile) */\n  requestAnimationFrame(function(){\n    var track = doc turn [\n      {t:'Preisbewusst',sub:set[0],f:['preis',set[0]]},\n      {t:'Ausgewogen',sub:set[1],f:['preis',set[1]]},\n      {t:'Premium-Auswahl',sub:set[2],f:['preis',set[2]]},\n      {t:'Preis ist zweitrangig',sub:'Alle Empfehlungen anzeigen',f:null}\n    ];\n  }\n  function priceFixed(a,b,c,lastT){\n    return [\n      {t:'Preisbewusst',sub:a[0],f:['preis',a[1]]},\n      {t:'Ausgewogen',sub:b[0],f:['preis',b[1]]},\n      {t:(lastT||'Premium-Auswahl'),sub:c[0],f:['preis',c[1]]},\n      {t:'Preis ist zweitrangig',sub:'Alle Empfehlungen anzeigen',f:null}\n    ];\n  }\n\n  const STEP1 = {id:'S1', q:'Welche Besteckart darf es sein?', sub:'W\u00e4hlen Sie zun\u00e4chst aus, ob Sie ein Set, einzelne Teile oder Besteck f\u00fcr besondere Anforderungen suchen.', opts:[\n    {t:'Besteck-Set',f:['prodart','Besteck-Set'],path:'A'},\n    {t:'Steakmesser-Set',f:['prodart','Steakmesser-Set'],path:'B'},\n    {t:'Kinderbesteck',f:['prodart','Kinderbesteck'],path:'C'},\n    {t:'Servierteile',f:['prodart','Servierteile'],path:'D'},\n    {t:'Einzelne Bestecke',f:['prodart','Einzelne Besteckteile'],path:'E'},\n    {t:'Ich bin noch unsicher',f:null,path:'A'}\n  ]};\n\n  function stepList(){\n    const P=fin.path;\n    if(!P) return [STEP1];\n    if(P==='A') return [STEP1,\n      {id:'A2',q:'F\u00fcr wie viele Personen m\u00f6chten Sie eindecken?',sub:'So finden wir ein Set mit dem passenden Umfang f\u00fcr Ihren Tisch.',opts:[\n        {t:'F\u00fcr 2 Personen',f:['setgr','F\u00fcr 2 Personen']},{t:'F\u00fcr 4 Personen',f:['setgr','F\u00fcr 4 Personen']},{t:'F\u00fcr 6 Personen',f:['setgr','F\u00fcr 6 Personen']},{t:'F\u00fcr 12 Personen',f:['setgr','F\u00fcr 12 Personen']},{t:'Ich bin noch unsicher',f:null}]},\n      {id:'A3',q:'F\u00fcr welche Momente soll Ihr Besteck passen?',sub:'Ob t\u00e4glich, intensiv oder zu besonderen Anl\u00e4ssen \u2013 wir stimmen die Empfehlung darauf ab.',opts:[\n        {t:'F\u00fcr den Alltag',f:['anlnu','F\u00fcr den Alltag']},{t:'F\u00fcr G\u00e4ste til','Modern & reduziert']},{t:'Klassisch & zeitlos',f:['stil','Klassisch & zeitlos']},{t:'Elegant & festlich',f:['stil','Elegant & festlich']},{t:'Keine Pr\u00e4ferenz',f:null}]},\n      {id:'B5',price:true,q:'Welcher Preisrahmen passt zu Ihrer Auswahl?',sub:'Wir ber\u00fccksichtigen Ihr Budget passend zur gew\u00e4hlten Auswahl.',opts:priceFixed(['Bis 100 \u20ac','Bis 100 \u20ac'],['100\u2013200 \u20ac','100\u2013200 \u20ac'],['Ab 200 \u20ac','Ab 200 \u20ac'])}\n    ];\n    if(P==='C') return [STEP1,\n      {id:'C2',q:'F\u00fcr wen darf das Kinderbesteck sein?',sub:'So finden wir eine Auswahl, die zum Alter und zum Anlass passt.',opts:[\n        {t:'Baby / Kleinkind',f:null},{t:'Kind',f:null},{t:'Als Geschenk',f:['anlnu','Als Geschenk']},{t:'Ich bin noch unsicher',f:null}]},\n      {id:'C3',q:'Was ist Ihnen dabei besonders wichtig?',sub:'Wir ber\u00fccksichtigen, ob das Besteck vor allem praktisch, robust oder als Geschenk gedacht ist.',opts:[\n        {t:'Kindgerechte Gr\u00f6\u00dfe',f:null},{t:'Robust & pflegeleicht',f:['spuel','Sp\u00fclmaschinenfest']},{t:'Verspieltes Design',f:['stil','Verspielt']},{t:'Hochwertiges Geschenk',f:['anlnu','Als Geschenk']},{t:'Keine Pr\u00e4ferenz',f:null}]},\n      {id:'C4',thumbs:true,q:'Welcher Stil passt am besten?',sub:'W\u00e4hlen Sie den Look, der zum Kind, zum Anlass oder zum Geschenk passt.',opts:[\n        {t:'Schlicht',f:['stil','Klassisch & zeitlos']},{t:'Verspielt',f:['stil','Verspielt']},{t:'Mit Motiv',f:['stil','Verspielt']},{t:'Keine Pr\u00e4ferenz',f:null}]},\n      {id:'C5',price:true,q:'Welcher Preisrahmen passt zu Ihrer Auswahl?',sub:'Wir ber\u00fccksichtigen Ihr Budget passend zum Anlass.',opts:priceFixed(['Bis 50 \u20ac','Bis 100 \u20ac'],['50\u2013100 \u20ac','100\u2013200 \u20ac'],['Ab 100 \u20ac','200\u2013300 \u20ac'],'Premium-Geschenk')}\n    ];\n    if(P==='D') return [STEP1,\n      {id:'D2',q:'Welche Servierteile d\u00fcrfen es sein?',sub:'W\u00e4hlen Sie, was Sie zum Servieren oder Erg\u00e4nzen Ihres Bestecks ben\u00f6tigen.',opts:[\n        {t:'Salatbesteck',f:null},{t:'Servierl\u00f6ffel',f:null},{t:'Serviergabel',f:null},{t:'Tortenheber',f:null},{t:'Saucenl\u00f6ffel / Sch\u00f6pfl\u00f6ffel',f:null},{t:'Vorlegebesteck-Set',f:null},{t:'Ich bin noch unsicher',f:null}]},\n      {id:'D3',q:'F\u00fcr welche Momente sollen die Servierteile passen?',sub:'Ob Alltag, G\u00e4ste oder Erg\u00e4nzung zu Ihrem bestehenden Besteck \u2013 wir stimmen die Auswahl darauf ab.',opts:[\n        {t:'F\u00fcr den Alltag',f:['anlnu','F\u00fcr den Alltag']},{t:'F\u00fcr G\u00e4ste & besondere Anl\u00e4sse',f:['anlnu','F\u00fcr G\u00e4ste & besondere Anl\u00e4sse']},{t:'Als Erg\u00e4nzung zu meinem Besteck',f:null},{t:'Als Geschenk',f:['anlnu','Als Geschenk']},{t:'Keine Pr\u00e4ferenz',f:null}]},\n      {id:'D4',thumbs:true,q:'Welcher Stil passt am besten zu Ihrem Besteck?',sub:'W\u00e4hlen Sie den Look, der Ihre Tafel harmonisch erg\u00e4nzt.',opts:[\n        {t:'Modern & reduziert',f:['stil','Modern & reduziert']},{t:'Klassisch & zeitlos',f:['stil','Klassisch & zeitlos']},{t:'Elegant & festlich',f:['stil','Elegant & festlich']},{t:'Keine Pr\u00e4ferenz',f:null}]},\n      {id:'D5',price:true,q:'Welcher Preisrahmen passt zu Ihrer Auswahl?',sub:'Wir ber\u00fccksichtigen Ihr Budget passend zu den gew\u00e4hlten Servierteilen.',opts:priceFixed(['Bis 50 \u20ac','Bis 100 \u20ac'],['50\u2013100 \u20ac','100\u2013200 \u20ac'],['Ab 100 \u20ac','200\u2013300 \u20ac'])}\n    ];\n    if(P==='E'){\n      const base=[STEP1,\n        {id:'E2',q:'Welches Teil m\u00f6chten Sie erg\u00e4nzen oder ersetzen?',sub:'So finden wir gezielt passende Einzelteile f\u00fcr Ihre Besteckauswahl.',opts:[\n          {t:'Messer',f:['prodart','Men\u00fcmesser']},{t:'Gabel',f:['prodart','Gabeln']},{t:'L\u00f6ffel',f:['prodart','L\u00f6ffel']},{t:'Kaffeel\u00f6ffel',f:['prodart','L\u00f6ffel']},{t:'Kuchengabel',f:['prodart','Gabeln']},{t:'Sonstiges Einzelteil',f:['prodart','Einzelne Besteckteile']}]},\n        {id:'E3',q:'Kennen Sie die passende Serie?',sub:'Wenn Sie die Serie kennen, zeigen wir Ihnen gezielter passende Einzelteile.',opts:[\n          {t:'Ja, ich kenne die Serie',f:null},{t:'Nein, ich bin unsicher',f:null},{t:'Ich m\u00f6chte einfach ein passendes Einzelteil finden',f:null}]}\n      ];\n      const e3=fin.answers['E3'];\n      if(e3 && e3.t==='Ja, ich kenne die Serie') base.push(\n        {id:'E4a',q:'Welche Serie darf es sein?',sub:'W\u00e4hlen Sie die Serie aus, zu der das Einzelteil passen soll.',opts:[\n          {t:'Kineo',f:['serie','Kineo']},{t:'Merit',f:['serie','Merit']},{t:'Kult Plus',f:['serie','Kult Plus']},{t:'Nuova',f:['serie','Nuova']},{t:'Boston',f:['serie','Boston']},{t:'Corvo',f:['serie','Corvo']},{t:'Andere Serie',f:null}]});\n      else if(e3 && e3.t==='Nein, ich bin unsicher') base.push(\n        {id:'E4b',q:'Welche Optik soll dazu passen?',sub:'So k\u00f6nnen wir Einzelteile mit einer \u00e4hnlichen Wirkung anzeigen.',opts:[\n          {t:'Poliert',f:['ober','Poliert']},{t:'Mattiert',f:['ober','Mattiert']},{t:'Schlicht',f:['stil','Modern & reduziert']},{t:'Dekorativ',f:['stil','Elegant & festlich']},{t:'Ich bin unsicher',f:null}]});\n      return base;\n    }\n    return [STEP1];\n  }\n\n  function totalSteps(){ return fin.path==='E' ? 4 : 5; }\n  function optSelected(step,opt){ if(opt.f) return F[opt.f[0]].has(opt.f[1]); const a=fin.answers[step.id]; return !!(a && a.t===opt.t && a.key===null); }\n  function reconcile(){ Object.keys(fin.answers).forEach(id=>{ const a=fin.answers[id]; if(a && a.key && !F[a.key].has(a.val)) delete fin.answers[id]; }); if(!fin.answers['S1']) fin.path=null; }\n  function clearFrom(list, fromIdx){ for(let i=fromIdx;i<list.length;i++){ const s=list[i]; const a=fin.answers[s.id]; if(a){ if(a.key) F[a.key].delete(a.val); delete fin.answers[s.id]; } } }\n\n  function selectOpt(step,opt){\n    const prev=fin.answers[step.id];\n    const list=stepList();\n    const myIdx=list.findIndex(s=>s.id===step.id);\n    if(prev && prev.t===opt.t){\n      if(prev.key) F[prev.key].delete(prev.val);\n      delete fin.answers[step.id];\n      if(step.id==='S1') fin.path=null;\n      if(step.id==='S1'||step.id==='E3') clearFrom(list, myIdx+1);\n    } else {\n      if(prev && prev.key) F[prev.key].delete(prev.val);\n      if(step.id==='S1'||step.id==='E3') clearFrom(list, myIdx+1);\n      if(opt.f) F[opt.f[0]].add(opt.f[1]);\n      fin.answers[step.id]={t:opt.t, key:opt.f?opt.f[0]:null, val:opt.f?opt.f[1]:null};\n      if(step.id==='S1') fin.path=opt.path;\n      if(step.id==='E2') F.prodart.delete('Einzelne Besteckteile');\n    }\n    syncChipsFromFilters(); paintPLP(); renderFinder();\n  }\n\n  function previewHtml(show){\n    if(!show) return '';\n    const list=sortProducts(visible());\n    const n=total();\n    if(!list.length) return \"<div class='finder-preview'><div class='fp-head'><span class='fp-title'>Passende Produkte<\u002Fspan><\u002Fdiv><div class='fp-empty'>F&uuml;r diese Auswahl gibt es aktuell keine Treffer.<\u002Fdiv><\u002Fdiv>\";\n    const cards=list.slice(0,6).map(p=>\"<div class='fp-card'><div class='fp-img'><svg class='shot \"+shotColorClass(p)+\"' viewBox='0 0 60 100'><use href='#i-cutlery'/><\u002Fsvg><\u002Fdiv><div class='fp-brand'>\"+p.brand+\"<\u002Fdiv><div class='fp-price'>&euro;\"+price(p)+\"<\u002Fdiv><\u002Fdiv>\").join('');\n    return \"<div class='finder-preview'><div class='fp-head'><span class='fp-title'>Passende Produkte<\u002Fspan><span class='fp-count'>\"+n+\" Treffer<\u002Fspan><\u002Fdiv><div class='fp-scroll'>\"+cards+\"<\u002Fdiv><\u002Fdiv>\";\n  }\n\n  function renderFinder(){\n    reconcile();\n    const list=stepList();\n    if(fin.step>list.length-1) fin.step=list.length-1;\n    if(fin.step<0) fin.step=0;\n    if(fin.done){ renderFinderDone(); return; }\n    const idx=fin.step, step=list[idx];\n    const canAdv=fin.answers[step.id]!=null;\n    const isLast=idx===list.length-1;\n    const optHtml=step.opts.map((o,i)=>{\n      const sel=optSelected(step,o)?' sel':'';\n      const th=step.thumbs?\"<span class='finder-thumb'><\u002Fspan>\":'';\n      const body=o.sub?(\"<span class='fo-l'>\"+o.t+\"<\u002Fspan><span class='fo-s'>\"+o.sub+\"<\u002Fspan>\"):o.t;\n      const cls='finder-opt'+sel+(o.sub?' two':'')+(step.thumbs?' thumb':'');\n      return \"<button class='\"+cls+\"' data-i='\"+i+\"'>\"+th+body+\"<\u002Fbutton>\";\n    }).join('');\n    const nextCls='finder-next '+(canAdv?'enabled':'disabled');\n    const backHtml=idx>0?\"<button class='finder-back' id='finderBack'>&#8592; Zur\u00fcck<\u002Fbutton>\":'';\n    const nextLbl=isLast?'Auswahl anzeigen &#8594;':'Weiter &#8594;';\n    finderEl.innerHTML=\"<div class='finder-head'><div class='finder-q'><span class='spark'>&#10022;<\u002Fspan> \"+step.q+\"<\u002Fdiv><div class='finder-step'>Schritt \"+(idx+1)+\" von \"+totalSteps()+\"<\u002Fdiv><\u002Fdiv>\"+\n      \"<div class='finder-hint'>\"+step.sub+\"<\u002Fdiv>\"+\n      \"<div class='finder-opts'>\"+optHtml+\"<\u002Fdiv>\"+\n      previewHtml(canAdv)+\n      \"<div class='finder-actions'>\"+backHtml+\"<button class='\"+nextCls+\"' id='finderNext'>\"+nextLbl+\"<\u002Fbutton><\u002Fdiv>\";\n    finderEl.querySelectorAll('.finder-opt').forEach(b=>{ b.addEventListener('click',()=>selectOpt(step, step.opts[+b.dataset.i])); });\n    const back=finderEl.querySelector('#finderBack'); if(back) back.addEventListener('click',()=>{ fin.step=Math.max(0,fin.step-1); renderFinder(); });\n    finderEl.querySelector('#finderNext').addEventListener('click',()=>{ if(!canAdv) return; if(isLast){ syncChipsFromFilters(); paintPLP(); pfToggle(false); } else { fin.step=idx+1; renderFinder(); } });\n  }\n\n  function renderFinderDone(){\n    const chips=Object.values(fin.answers).filter(a=>a.key).map(a=>\"<span class='finder-chip'>\"+a.val+\"<button class='fc-x' data-k='\"+a.key+\"' data-v='\"+a.val+\"'>&times;<\u002Fbutton><\u002Fspan>\").join('');\n    finderEl.innerHTML=\"<div class='finder-q'><span class='spark'>&#10022;<\u002Fspan> Ihre Auswahl wurde angewendet.<\u002Fdiv>\"+\n      \"<div class='finder-hint' style='margin-left:28px'>Sie k\u00f6nnen die Auswahl \u00fcber die Filter oder die aktiven Chips weiter anpassen.<\u002Fdiv>\"+\n      \"<div class='finder-chips'>\"+(chips||\"<span style='color:#5e5326;font-size:13px'>Keine Filter gesetzt.<\u002Fspan>\")+\"<\u002Fdiv>\"+\n      \"<div class='finder-actions-row'><button class='finder-next restart' id='finderEdit'>Auswahl \u00e4ndern<\u002Fbutton><button class='finder-next enabled' id='finderRestart'>Neu starten<\u002Fbutton><\u002Fdiv>\";\n    finderEl.querySelectorAll('.fc-x').forEach(x=>{ x.addEventListener('click',()=>{ F[x.dataset.k].delete(x.dataset.v); Object.keys(fin.answers).forEach(id=>{ const a=fin.answers[id]; if(a.key===x.dataset.k && a.val===x.dataset.v) delete fin.answers[id]; }); if(!fin.answers['S1']) fin.path=null; syncChipsFromFilters(); paintPLP(); renderFinder(); }); });\n    finderEl.querySelector('#finderEdit').addEventListener('click',()=>{ fin.done=false; fin.step=0; renderFinder(); });\n    finderEl.querySelector('#finderRestart').addEventListener('click',()=>{ Object.values(fin.answers).forEach(a=>{ if(a.key) F[a.key].delete(a.val); }); fin.answers={}; fin.path=null; fin.step=0; fin.done=false; syncChipsFromFilters(); paintPLP(); renderFinder(); });\n  }\n  renderFinder();\n})();\n<\u002Fscript>\n<script>\n  window.pfToggle = function pfToggle(open){\n    var f=document.getElementById('pf-finder');\n    f.classList.toggle('pf-open', open);\n    document.getElementById('pf-btn').setAttribute('aria-expanded', open?'true':'false');\n  }\n<\u002Fscript>\n<script>(function(){\n  var q=document.getElementById('q');if(q)q.placeholder='Suchen';\n  var af=document.getElementById('allFilters'),sort=document.getElementById('sort');\n  if(af&&sort){var w=document.createElement('div');w.className='m-sortwrap';var l=document.createElement('div');l.className='ftitle';l.textContent='Sortieren nach';w.appendChild(l);w.appendChild(sort);af.appendChild(w);}\n})();<\u002Fscript>\n\n\n \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n<\u002Fbody><\u002Fhtml>"
