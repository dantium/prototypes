accessories","label":"Outdoors accessories","count":2,"status":"NAMI","review":"","thumb":"/5/8/5894035e-64d8-4dfe-97f8b8dcbc67f0f1-396476f2-3201018449-20260114-160010.jpg","image":"https://www.wmf.com/media/catalog/product/f/c/fca98bbf-4a0b-40b4-a44e74ed8dd877c3-396476f2-3201018428-20260124-064754.jpg?optimize=medium&bg-color=255,255,255&fit=bounds&height=360&width=360&canvas=360:360","subs":[],"products":[153,483]}],"status":"NAMI","review":""}]}}},"review":[{"id":"coffee-beans","level":"Subcategory","l1":"Beverage & breakfast","l2":"Coffee Machines","l3":"Coffee beans","holds":"WMF Café Crema and Espresso beans, 500 g","rec":"New subcategory of Coffee Machines. Fallback if NAMI refuses: Drink & breakfast accessories.","why":"Shoppers buy beans for their machine and buy them again. wmf.com/de and De’Longhi list beans with the machines.","status":"Proposed","decision":"Keep (Dan, 20 Nov 2026)","de":4,"es":0},{"id":"french-presses","level":"Subcategory","l1":"Beverage & breakfast","l2":"Coffee Machines","l3":"French presses","holds":"Kult French Press, and a camping set of the press with a coffee tin","rec":"New subcategory of Coffee Machines. The KULT espresso maker stays in Manual espresso machines.","why":"Shoppers search for \"French press\"; Melitta and Bodum give presses their own section. NAMI’s Filter coffee makers holds electric drip machines only.","status":"Proposed","decision":"Keep as French presses (Dan, 20 Nov 2026)","de":2,"es":1},{"id":"popcorn-makers","level":"Subcategory","l1":"Cooking appliances","l2":"Convivial cooking & snacking","l3":"Popcorn makers","holds":"KITCHENminis Popcorn Maker","rec":"New subcategory of Convivial cooking & snacking.","why":"Popcorn is snacking, and none of the four NAMI subcategories fits. Unold lists popcorn makers beside fondue, waffle and sandwich makers.","status":"Proposed","decision":"Keep (Dan, 20 Nov 2026)","de":1,"es":1},{"id":"drinking-glasses","level":"Subcategory","l1":"Kitchenware","l2":"Drinkware","l3":"Drinking glasses","holds":"Wine, champagne and long drink glasses","rec":"New subcategory of Drinkware. Drinkware is the things you drink from; NAMI’s Drinkware has only travel mugs and bottles.","why":"Zwilling files glasses under drinking vessels; wmf.com/de has Gläser & Karaffen. Coffee and tea glasses have their own subcategory (item 11).","status":"Proposed","decision":"Keep (Dan, 20 Nov 2026)","de":5,"es":2},{"id":"kitchen-organisers","level":"Subcategory","l1":"Kitchenware","l2":"Kitchen tools","l3":"Kitchen organisers","holds":"Depot kitchen roll holder and Depot utensil holder","rec":"New subcategory of Kitchen tools, with a label NAMI can reuse for roll, utensil and lid holders.","why":"Same rule as French presses and Popcorn makers: a clear product type gets its own subcategory, even when small. Neither product holds food, so Food storage does not fit. Competitors and retailers treat organisers as a type of their own: Zwilling has Kitchen Organisation > Kitchen Utensil Holders (UK; Küchenorganisation in DE); Dunelm has Kitchen Organisers with Kitchen Roll Holders as a product type; Otto has Küchenaufbewahrung > Rollenhalter; eBay DE files roll holders under Ordnung & Aufbewahrung. wmf.com has no such category and files both under Kitchen gadgets > Kitchen utensils.","status":"Proposed","decision":"Keep (Dan, 24 Nov 2026)","de":2,"es":0},{"id":"scissors","level":"Subcategory","l1":"Kitchenware","l2":"Kitchen tools","l3":"Scissors & poultry shears","holds":"Kitchen scissors and poultry shears","rec":"New subcategory of Kitchen tools.","why":"wmf.com files them as Kitchen gadgets > Scissors, next to the other tools. In Germany, Zwilling (Küchenhelfer > Küchenscheren), Wüsthof (Kitchen essentials > Scissors & shears) and Otto (Koch- & Backzubehör > Küchenscheren) do the same; Zwilling UK has Gadgets > Kitchen shears & scissors. Only Victorinox (Cutlery > Scissors) and Zwilling US (both places) put them with knives. Knives was considered (it has 3 links against 11 in Kitchen tools) and set aside.","status":"Proposed","decision":"Keep under Kitchen tools (Dan, 24 Nov 2026)","de":11,"es":2},{"id":"timers","level":"Subcategory","l1":"Kitchenware","l2":"Kitchen tools","l3":"Timers & thermometers","holds":"Kitchen timers and meat thermometers","rec":"One new subcategory of Kitchen tools. The Spanish wine bottle thermometer goes to Bar & wine accessories (under Drinkware, item 10).","why":"wmf.com splits them (timers under Kitchen appliances, thermometers under BBQ & accessories); one home is clearer, and retailers group them: Boozt sells them as \"Thermometer & Küchentimer\", Otto has Koch- & Backzubehör > Thermometer (roasting, kitchen and cooking thermometers), REWE has Küchenthermometer. Rösle files grill thermometers under BBQ accessories but sells a roasting thermometer for the kitchen. Set aside: Food preparation > Preparation tools (an appliance universe) and a split like wmf.com (Outdoors in Spain has 4 products).","status":"Proposed","decision":"Keep in Kitchen tools; wine thermometer to Bar & wine accessories (Dan, 24 Nov 2026)","de":13,"es":1},{"id":"seasoning","level":"Subcategory","l1":"Kitchenware","l2":"Kitchen tools","l3":"Seasoning mills, shakers & dispensers","holds":"Salt, pepper and spice mills (manual and electric), shakers, oil and vinegar dispensers","rec":"New subcategory of Kitchen tools that holds mills, shakers and dispensers together; offer manual or electric as a filter. The Barista honey/syrup dispenser goes to Drink & breakfast accessories.","why":"The largest new subcategory. wmf.com has Spice grinder and Salt and pepper shakers under Kitchen gadgets. Mills and shakers are kept together by Zwilling (DE Küchenhelfer > Gewürzmühlen, with a salt cellar; ES Molinillos de especias; IT Macinaspezie), Alessi (Spice & Condiment Tools, with oil sets), IKEA (Spice & condiment stands), Höffner, Wayfair UK, Birch Lane, MOHD and eBay DE. Only Otto splits them (mills under Koch- & Backzubehör, shakers under Tischaccessoires).","status":"Proposed","decision":"Keep together in Kitchen tools; syrup dispenser to Drink & breakfast accessories (Dan, 24 Nov 2026)","de":57,"es":12},{"id":"herb-gardens","level":"Subcategory","l1":"Kitchenware","l2":"Kitchen tools","l3":"Herb gardens","holds":"Indoor herb gardens and replacement wicks","rec":"New subcategory of Kitchen tools.","why":"wmf.com has them under Kitchen storage, but nothing is stored in them; the only NAMI match was Outdoors > Garden products.","status":"Proposed","decision":"Kitchen tools (Dan, 12 Nov 2026)","de":3,"es":0},{"id":"bar-wine","level":"Subcategory","l1":"Kitchenware","l2":"Drinkware","l3":"Bar & wine accessories","holds":"Corkscrews, sommelier sets, wine coolers, bottle seals, shakers and bar sets, straws, coasters, hip flask set","rec":"New subcategory of Drinkware, next to Drinking glasses (wmf.com has it under Tableware).","why":"Retailers put bar and wine tools next to the glasses: IKEA Kitchenware & tableware > Glassware > Drinking accessories (beside wine, bar and drinking glasses); Breuninger Tisch & Bar > Barartikel beside Gläser and Karaffen; Höffner Gläser & Weinzubehör; Waitrose and John Lewis Glassware & barware; Williams-Sonoma Tabletop, Glassware & Bar; Crate & Barrel Tabletop & Bar; El Corte Inglés Menaje de mesa > Accesorios para vino beside Copas. Own group: Otto Barzubehör, Alessi Barware & Wine Accessories; with kitchen tools: Zwilling Weinzubehör. NAMI may want a broader Drinkware label, such as Glassware & bar.","status":"Proposed","decision":"Drinkware, next to Drinking glasses (Dan, 24 Nov 2026)","de":27,"es":10},{"id":"coffee-table","level":"Subcategory","l1":"Kitchenware","l2":"Drinkware","l3":"Coffee & tea glasses","holds":"Espresso, cappuccino, café crème and latte macchiato glass sets (Barista, Clever & More, CoffeeTime, Kineo, KULT) and double-walled tea glasses (SmarTea)","rec":"New subcategory of Drinkware for coffee and tea glasses. The sugar bowls and dispensers go to Tableware > Table accessories.","why":"Shops give coffee glasses a category of their own: Otto Gläser > Kaffeegläser with Latte-Macchiato-Gläser (182) and Espressogläser; Höffner Latte Macchiato Gläser (36); Zwilling Gläser > Doppelwandige Gläser; De’Longhi Kaffeetassen und -gläser (DE) and Tazas y vasos de café (ES); El Corte Inglés Menaje de mesa > Café y té. eBay DE has category pages for latte macchiato glasses and Galaxus types them as Latte Macchiato Cup; review sites test Kaffeegläser and Latte Macchiato Gläser as a product type. Set aside: Drink & breakfast accessories (no subcategories, mostly spare parts) and folding them into Drinking glasses.","status":"Proposed","decision":"New subcategory Drinkware > Coffee & tea glasses; sugar items to Table accessories (Dan, 24 Nov 2026)","de":14,"es":8},{"id":"plates-bowls","level":"Subcategory","l1":"Kitchenware","l2":"Tableware","l3":"Children's tableware","holds":"Children's plates and muesli bowls, kids cutlery sets, kids egg cups and a 6-piece plate, bowl and cutlery set (licensed designs such as Janosch, Paw Patrol, Minions, Unicorn)","rec":"New subcategory of Tableware for every children’s tableware product, kids cutlery included.","why":"WMF sells children’s plates, bowls and cutlery, and mixed sets of all three, so one subcategory holds them together. Shops group children’s plates, bowls and cutlery: Otto Geschirr > Kindergeschirr (with a WMF filter), El Corte Inglés Menaje de mesa > Menaje infantil (platos, bowls, mugs, cubiertos infantiles), IKEA Children’s kitchenware & tableware, Dunelm Kids and toddler tableware, Argos Kids tableware and cutlery, Baur Kindergeschirr, Galaxus Kindergeschirr + Kinderbesteck. Kids cutlery under Cutlery instead: wmf.com (Bestecke > Besteck-Sets > Kinderbestecke) and Zwilling (Bestecke > Kinderbestecke). A cross-link from Cutlery is not easy in NAMI, so all children’s products sit here. The alias option links the Cutlery menu entry to the Children’s cutlery filter on this page.","status":"Proposed","decision":"Children’s tableware, kids cutlery included; revisit a cutlery cross-link if NAMI supports it (Dan, 24 Nov 2026)","de":41,"es":18},{"id":"baskets-trays","level":"Subcategory","l1":"Kitchenware","l2":"Tableware","l3":"Serveware","holds":"Bread and fruit baskets (Lounge Living, Concept) and a serving tray (Club)","rec":"New subcategory of Tableware, named \"Serveware\" so NAMI can also use it for serving bowls and platters.","why":"Serving pieces are a product type of their own: IKEA Serveware (93 in Germany: bread baskets, fruit bowls, trays); Crate & Barrel Serveware (serving trays, serving baskets, serving bowls). wmf.com has Tableware > Baskets and Trays. Considered and set aside: merging into Table accessories, as El Corte Inglés (Complementos de mesa with Fruteros y paneras) and Otto (Tischaccessoires > Brotkörbe) do.","status":"Proposed","decision":"Keep as Serveware (Dan, 24 Nov 2026)","de":4,"es":0},{"id":"table-accessories","level":"Subcategory","l1":"Kitchenware","l2":"Tableware","l3":"Table accessories","holds":"Butter dishes and covers, a 6-piece egg cup set, a napkin ring set, sugar bowls and dispensers, casserole stands and a trivet","rec":"New subcategory of Tableware, as its catch-all. The kitchen towel set goes to Cookware accessories > Care & cleaning (item 15).","why":"Shops have this kind of category: Otto Haushalt > Tischaccessoires (Butterdosen, Serviettenringe, Brotkörbe); El Corte Inglés Menaje de mesa > Complementos de mesa (butter dishes, egg cups). The kids egg cups are in Children’s tableware (item 12); the 6-piece set is not a children’s design. Tea towels are filed under cleaning or textiles, never with table accessories: Otto Reinigung > Putzhelfer > Geschirrtücher, wmf.com Care & cleaning products, Brabantia (sink), Lakeland; textiles at Zwilling, IKEA, El Corte Inglés. NAMI has no textiles category.","status":"Proposed","decision":"Keep; kitchen towel set to Care & cleaning (Dan, 24 Nov 2026)","de":12,"es":1},{"id":"care-cleaning","level":"Subcategory","l1":"Cookware","l2":"Cookware accessories","l3":"Care & cleaning","holds":"Detergents, scouring pads, cooktop scraper, brush heads, the WMF cleaning towel and the kitchen towel set","rec":"Rename NAMI’s Stainless steel cleaning products to Care & cleaning. A label change, not a new subcategory.","why":"What WMF files there is broader than stainless steel cleaning; wmf.com calls the group Care & cleaning products. Otto files tea towels under Reinigung > Putzhelfer.","status":"Proposed","decision":"Rename to Care & cleaning (Dan, 24 Nov 2026)","de":8,"es":0},{"id":"spare-parts","level":"Menu placement","l1":"Cookware","l2":"Cookware accessories","l3":"Spare parts","holds":"Pressure cooker seals, sealing rings and safety valves","rec":"File spare parts in Cookware accessories > Lids & steamer baskets, and list them under the Services menu (Spare parts & accessories), which opens that list with the spare parts filter applied.","why":"Sealing rings and valves are parts of the pressure cooker lid, so Lids & steamer baskets is the closest NAMI subcategory (a loose fit). Every product is then mapped once in the tree. Lagostina, the first NAMI brand, puts spare parts in a care-hub menu entry, and wmf.com already has Spare parts & accessories under Services.","status":"Confirmed","decision":"Filed in Lids & steamer baskets and listed under the Services menu (Dan, 26 Nov 2026)","de":16,"es":14},{"id":"english-labels","level":"Labels","l1":"","l2":"","l3":"English label corrections","holds":"NAMI labels that read oddly in English: \"Pots & pans battery\" and \"Battery\" (under Removable handle), \"Ultra Poweful Blenders\", \"jugs & jars\", \"ovenware\" and \"Convivial cooking & snacking\". The counts are the WMF products filed under these labels.","rec":"Use \"sets\" in place of \"battery\": Pots & pans sets and Sets, as this workbook already shows them. Correct the typo to \"Ultra Powerful Blenders\". Capitalise \"Jugs & jars\" and \"Ovenware\". Consider a plainer name for Convivial cooking & snacking.","why":"\"Battery\" comes from the French \"batterie de cuisine\" and does not mean a set of pans in English. The others are a typo, two missing capitals and a word that is uncommon in English (\"convivial\"). These are label changes only: no category, subcategory or product moves. WMF has no products in Ultra Poweful Blenders, so that fix is for the other brands.","status":"Proposed","decision":"Proposed to NAMI (Dan, 26 Nov 2026)","de":194,"es":73},{"id":"kitchenware-accessories","level":"Category","l1":"Kitchenware","l2":"Kitchenware accessories","l3":"","holds":"Kitchen products that no Kitchenware category holds: the Anti-Odor Refrigerator Deodorizer and the Ambient Multi-Plug Pro, a power strip with LED lights","rec":"New category of Kitchenware, with no subcategories, like the accessories category of the other universes.","why":"The six other universes WMF uses each have an accessories category: Cookware accessories, Cooking accessories, Food preparation accessories, Baking & Desserts accessories, Drink & breakfast accessories and Outdoors accessories. Kitchenware has none, so these products had no home. It is the only new category (level 2) in this proposal; every other addition is a subcategory. It holds two products today.","status":"Proposed","decision":"New category Kitchenware accessories for the fridge deodorizer and the Multi-Plug Pro: it follows the NAMI format of an accessories category (Dan, 26 Nov 2026)","de":2,"es":0}],"es":{"Cookware":"Menaje de cocina","Kitchenware":"Artículos de cocina","Beverage & breakfast":"Bebidas y desayuno","Baking & Desserts":"Repostería","Food preparation":"Preparación de alimentos","Cooking appliances":"Aparatos de cocción","Outdoors":"Exterior","Intense searing · uncoated steel":"Sellar a fuego fuerte · acero sin revestimiento","Intense searing · SearProtect® ceramic":"Sellar a fuego fuerte · cerámica SearProtect®","Gentle frying · Perm <script>
(()=>{
const D=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const q=new URLSearchParams(location.search);
const S={market:q.get('market')||store.get('wmf-uni-market')||'de',lang:q.get('lang')||store.get('wmf-uni-lang')||'en',
  view:q.get('view')||store.get('wmf-uni-view')||'nami',menu:'products',tags:(store.get('wmf-uni-tags')??'1')==='1',uni:null,open:false,level:'root'};
if(!D.markets||!D.markets[S.market])S.market='de';
if(S.view!=='alias')S.view='nami';   // the Cutlery variations were replaced by the alias option
if(S.market==='de')S.lang='en';
// UI words in Spanish (my translations); category labels come from the earlier prototype's dictionary (wmf.com/es wording where it exists)
const UI_ES={'Products':'Productos','Menu':'Menú','Collections':'Colecciones','Offers':'Ofertas','Recipes':'Recetas','Services':'Servicios','Discover':'Descubrir',
 'See all':'Ver todo','Back':'Atrás','Discover {x}':'Descubre {x}','New':'Nuevo','Variation':'Variante','Alias':'Alias','Type':'Tipo','Cooking technique':'Técnica de cocción','Material':'Material','Surface':'Superficie','Material & surface':'Material y superficie','Knife type':'Tipo de cuchillo','Finish':'Acabado','Also see':'Ver también','Discover more':'Descubrir más','Cutlery type':'Tipo de cubierto','Product type':'Tipo de producto','For':'Para','Range':'Gama','All products':'Todos los productos','products':'productos','Home':'Inicio',
 'Join MY WMF':'Únete a MY WMF','Top ranges':'Gamas destacadas','Set offers':'Ofertas en sets','What are you looking for?':'¿Qué estás buscando?','Search':'Buscar','No matches in the menu':'Ningún resultado en el menú'};
const t=s=>S.lang==='es'?(UI_ES[s]||D.es[s]||s):s;
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;   // NAMI has a few lowercase labels (jugs & jars, ovenware)
const tl=s=>cap(S.lang==='es'?(D.es[s]||s):s);
const fmt=(s,x)=>t(s).replace('{x}',x);
const chev='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
const back='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
// fonts and logo from wmf.com, as in the earlier prototype
const st=document.createElement('style');st.textContent=(D.fonts||[]).map(f=>`@font-face{font-family:'WMF Rotis';font-weight:${f.weight};font-style:normal;font-display:swap;src:url('${f.url}') format('woff2')}`).join('');document.head.append(st);
$('#logo').src=D.logo;
document.addEventListener('error',e=>{if(e.target.tagName==='IMG'&&!e.target.closest('.brand'))e.target.style.visibility='hidden'},true);

const IM=p=>p?D.img[0]+p+D.img[1]:'';
const M=()=>D.markets[S.market], U=()=>M().views.nami;   // one structure; the alias option adds entries above it
const R=Object.fromEntries((D.review||[]).map(r=>[r.id,r]));
const findU=id=>U().find(u=>u.id===id)||U()[0];
function tag(x,parent){
  if(!x||(x.status!=='New'&&x.status!=='Variation'))return '';
  if(parent&&parent.status==='Variation')return '';   // the category tag already says it
  const r=R[x.review]; const s=r?r.status.toLowerCase():'open';
  return `<button class="tag ${x.status.toLowerCase()}" data-review="${esc(x.review)}" title="${esc(x.status==='New'?(x.subs?'New category for NAMI':'New subcategory for NAMI'):'Variation proposal')} · ${esc(r?r.status:'')}"><i class="${s}"></i>${esc(t(x.status))}</button>`;
}
const cnt=n=>`<span class="n">${n}</span>`;
const href=(...p)=>'#/'+[S.market,...p].map(encodeURIComponent).join('/');

/* ---------- menu aliases (proposed option, 25 Nov 2026): top-level entries per market that point into the NAMI structure ---------- */
const AL=()=>M().aliases||[];
const aliasOn=()=>S.view==='alias'&&AL().length>0;
function ahref(a,kind,id){   // where an alias link goes: the NAMI category or subcategory page, with the type, filter or range applied
  const to=a.to.filter(Boolean);
  if(kind==='finder')return href('alias',a.id,'finder');
  if(kind==='type'){const x=a.types.find(y=>y.id===id);return x&&x.sid?href(a.to[0],a.to[1],x.sid):href(...to,'f:'+id);}
  if(kind==='filter'){const f=a.filters.flatMap(g=>g.links).find(y=>y.id===id);return href(...(f&&f.to?f.to:to),'f:'+id);}
  if(kind==='range')return href(...to,'r:'+id);
  return href(...to);
}
function aNode(a){const u=U().find(x=>x.id===a.to[0]);const c=u&&u.cats.find(x=>x.id===a.to[1]);const s=c&&a.to[2]?c.subs.find(x=>x.id===a.to[2]):null;return {u,c,s,node:s||c};}
const aliasTag=()=>`<span class="tag alias" title="Alias: a top-level menu entry that points to a NAMI category or subcategory. Nothing moves in the structure.">${esc(t('Alias'))}</span>`;
const aPath=a=>a.path.map(tl).join(' › ');
function aliasGroups(a){   // [title, [[label, href, count, isNew, kind]], kind of the whole group] for the menu panel and the home map
  const g=[];
  if(a.types.length)g.push(['Type',a.types.map(x=>[tl(x.label),ahref(a,'type',x.id),x.count,x.status==='New']),a.types[0].sid?'L3':'Filter']);
  a.filters.forEach(f=>g.push([f.title,f.links.map(x=>[tl(x.label),ahref(a,'filter',x.id),x.count]),'Filter']));
  if(a.related.length)g.push(['Also see',a.related.map(x=>[tl(x.label),href(...x.to),x.count,false,/^f:/.test(x.to[x.to.length-1])?'Filter':x.to.length>2?'L3':'L2']),null]);
  return g;
}
// what kind of thing a menu link is: a NAMI level, a navigation filter, a range or a service page
const KIND={L1:['l','Universe, NAMI level 1'],L2:['l','Category, NAMI level 2'],L3:['l','Subcategory, NAMI level 3'],Filter:['f','Navigation filter: a product attribute in the PIM'],Range:['r','Range: the range field planned for the PIM'],Service:['s','A page of the Services menu'],Page:['s','Content page, such as the product finder quiz']};
const kind=k=>k?`<span class="kind k-${KIND[k][0]}" title="${esc(KIND[k][1])}">${k}</span>`:'';
const newTag=()=>`<span class="tag new">${esc(t('New'))}</span>`;
function aliasRanges(a){
  if(a.feature&&a.feature.length)return a.feature.map(f=>`<a class="al-rng" href="${esc(f.href)}"><span class="im"><img src="${esc(f.img)}" srcset="${esc(f.img2||f.img)} 2x" alt="" loading="lazy"></span><b>${esc(f.label)}</b><small>${esc(f.tag||'')}</small></a>`).join('');
  return a.ranges.map(r=>`<a class="al-rng" href="${ahref(a,'range',r.id)}"><span class="im">${r.thumb?`<img src="${esc(IM(r.thumb))}" alt="" loading="lazy">`:''}</span><b>${esc(r.label)}</b><small>${r.count} ${esc(t('products'))}</small></a>`).join('');
}
// Product finder (quiz) link of an alias (Dan, 26 Nov 2026: "add a link to the product quiz, e.g. Pans Product Finder"). Germany only:
// wmf.com/es has no product advisors. `live` = the quiz on wmf.com/de today (checked 26 Nov 2026); pans and knives have none yet.
const WD='https://www.wmf.com/de/de/';
const FINDERS={pans:{noun:'pan'},pots:{noun:'pot',live:'produkte/toepfe/topfberater.html',name:'Topfberater'},
  cutlery:{noun:'cutlery',live:'produkte/bestecke/besteckberater.html',name:'Besteckberater'},knives:{noun:'knife',guide:'inspirationen/messer/messer-kaufberatung.html'},
  'coffee-machines':{noun:'coffee machine',live:'produkte/kaffeemaschinen/kaffeeberater.html',name:'Kaffeeberater'}};
const finderOf=a=>S.market==='de'?FINDERS[a.id]:null;
const finderName=a=>`${tl(a.label)} Product Finder`;
const icoFinder='<svg class="finder-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>';
function finderLink(a){
  const f=finderOf(a); if(!f)return '';
  return `<a class="al-finder" href="${ahref(a,'finder')}">${icoFinder}<span><b>${esc(finderName(a))}</b><small>Answer a few questions and find the right ${esc(f.noun)}</small></span>${chev}</a>`;
}
function finderDest(a){
  const f=finderOf(a), {u,c,s}=aNode(a); if(!f)return home();
  const now=f.live?`wmf.com/de has this quiz today as the ${esc(f.name)}.`:f.guide?'wmf.com/de has no knife quiz today, only a buying guide.':'wmf.com/de has no pan quiz today, so this one is new.';
  const out=f.live?`<a class="btn" href="${WD+f.live}" target="_blank" rel="noopener">Open the ${esc(f.name)} on wmf.com</a>`:f.guide?`<a class="btn" href="${WD+f.guide}" target="_blank" rel="noopener">Open the knife buying guide on wmf.com</a>`:'';
  return `<nav class="crumbs"><a href="#/">${esc(t('Home'))}</a>›<a href="${ahref(a)}">${esc(tl(a.label))}</a>›<span>${esc(finderName(a))}</span></nav>
   <span class="eyebrow">Product finder · content page · destination preview</span>
   <h1>${esc(finderName(a))}</h1><p class="lead">A short quiz: answer a few questions and find the right ${esc(f.noun)}.</p>
   <div class="al-note"><b>Product finder.</b> This link opens a content page, not a product list. The quiz ends on products from the NAMI ${a.level.toLowerCase()} ${esc(aPath(a))}, so nothing moves in the structure. ${now}</div>
   ${out} <a class="btn" href="${ahref(a)}" style="background:#fff;color:#111;border:1px solid #111">Back to ${esc(tl(a.label).toLowerCase())}</a>`;
}
function aliasPanel(a){
  const rng=aliasRanges(a);
  return `<button class="mobile-back" data-back>${back}${esc(t('Back'))}</button>
  <div class="panel-head"><h2 id="panel-title">${esc(tl(a.label))}${aliasTag()}</h2><a class="see-all" href="${ahref(a)}">${esc(t('See all'))} ${esc(tl(a.label).toLowerCase())}${chev}</a><span class="al-path">→ ${esc(aPath(a))}</span></div>
  <div class="panel-body"><div><div class="al-cols">${aliasGroups(a).map(([title,links])=>`<div class="al-grp"><h3>${esc(t(title))}</h3><ul>${links.map(([l,h,n,nw])=>`<li><a href="${h}">${esc(l)}</a>${n!=null?cnt(n):''}${nw?newTag():''}</li>`).join('')}</ul></div>`).join('')}</div>
    ${rng?`<div class="al-ranges"><h3>${esc(t('Top ranges'))}</h3><div class="al-rng-grid">${rng}</div></div>`:''}${finderLink(a)}</div>
  <div class="promos">${teaserFor(a.id,a.label,a.image,ahref(a))}${S.market==='de'?club():''}</div></div>`;
}
function railRows(us,u,a){
  const row=(x,attr,cur,sm)=>`<button class="u-row${sm?' sm':''}" ${attr}="${x.id}" aria-current="${cur}"><span>${esc(tl(x.label))}<span class="u-count">${x.count}</span></span>${chev}</button>`;
  if(!aliasOn())return us.map(x=>row(x,'data-uni',x.id===u.id)).join('');
  return AL().map(x=>row(x,'data-alias',!!a&&x.id===a.id)).join('')+`<h3 class="rail-sub">${esc(t('All products'))}</h3>`+us.map(x=>row(x,'data-uni',!a&&x.id===u.id,true)).join('');
}
function aliasMap(){
  const where=S.market==='de'?'Germany':'Spain';
  const li=([l,hr,n,nw,k])=>`<li><a href="${esc(hr)}">${esc(l)}</a>${n!=null?cnt(n):''}${nw?newTag():''}${kind(k)}</li>`;
  return `<h2 class="sec">Aliases in the menu</h2><p class="sec-note">Top-level entries chosen for ${where}. Each one points to a NAMI category or subcategory and adds its own type, navigation filter and range links${AL().some(finderOf)?', and a link to its product finder quiz':''}. Each link opens the NAMI page it points to, with the filter or range applied. Nothing moves in the structure shown in the menu map below.</p>
  <p class="kind-legend">${['L1','L2','L3','Filter','Range'].concat(AL().some(finderOf)?['Page']:[]).map(k=>`<span>${kind(k)} ${esc(KIND[k][1])}</span>`).join('')}</p>
  <div class="map">${AL().map(a=>{
    const rng=a.feature&&a.feature.length?a.feature.map(f=>[f.label,f.href]):a.ranges.map(r=>[r.label,ahref(a,'range',r.id),r.count]);
    return `<div class="map-u"><h3><a href="${ahref(a)}">${esc(tl(a.label))}</a>${cnt(a.count)}</h3><div class="al-to">→ ${kind(a.level==='Category'?'L2':'L3')} ${esc(aPath(a))}</div>
    ${aliasGroups(a).map(([title,links,k])=>`<div class="map-c"><b>${esc(t(title))}</b>${kind(k)}<ul>${links.map(li).join('')}</ul></div>`).join('')}
    ${rng.length?`<div class="map-c"><b>${esc(t('Top ranges'))}</b>${kind('Range')}<ul>${rng.map(li).join('')}</ul></div>`:''}
    ${finderOf(a)?`<div class="map-c"><b>Product finder</b>${kind('Page')}<ul><li><a href="${ahref(a,'finder')}">${esc(finderName(a))}</a></li></ul></div>`:''}</div>`}).join('')}</div>`;
}
// One destination per product list (Dan, 26 Nov 2026: a separate alias preview was confusing and went against the concept). An alias
// link opens the NAMI page it points to; only the product finder has a page of its own. Old alias addresses forward to that page.
function aliasDest(aid,kind,id){
  const a=AL().find(x=>x.id===aid); if(!a)return home();
  if(kind==='finder')return finderDest(a);
  location.replace(ahref(a,kind,id)); return '';
}

/* ---------- menu ---------- */
// Marketing blocks of the menu (Dan, 25 Nov 2026: "more realistic and relatable"): wmf.com's own campaign teasers (the portrait cards
// of its home page, checked 25 Nov 2026), matched to the menu panel, and the MY WMF card in the style of the earlier prototype.
const WM='https://www.wmf.com/media/', WS='https://www.wmf.com/de/en/';
const TEASERS={
  fusiontec:{title:'Fusiontec cookware',img:WM+'wysiwyg/Teaser_Fusiontec.jpg',page:'masterpieces/fusiontec-cookware.html'},

  iconic:{title:'Iconic cookware',img:WM+'wysiwyg/Iconic_teaser.jpg',page:'campaigns/signature/iconic.html'},
  cromargan:{title:'Cromargan protect',img:WM+'wysiwyg/Cromargan_Teaser.jpg',page:'masterpieces/cromargan-protect-cutlery.html'},
  knives:{title:'Ultimate Black knives',img:WM+'wysiwyg/Teaser_Damasteel.jpg',page:'masterpieces/ultimate-black-knives.html'},
  perfection:{title:'Perfection',line:'Coffee delight for all your senses',img:WM+'wysiwyg/Perfection_Teaser.jpg',page:'masterpieces/perfection-coffee-machine.html'},
  minis:{title:'WMF KITCHENminis',img:WM+'.renditions/wysiwyg/02Campaigns/Kitchenminis/Kitchenminis_LP_Stage_Desktop.jpg',page:'masterpieces/kitchenminis-collection.html',pos:'74% 50%'},
};
// which teaser a menu panel shows: by universe id or alias id
const TEASER_FOR={cookware:'fusiontec',pans:'fusiontec',pots:'castiron','pressure-cookers':'iconic',kitchenware:'cromargan',cutlery:'cromargan',knives:'knives',
  'beverage-breakfast':'perfection','coffee-machines':'perfection','food-preparation':'minis','cooking-appliances':'minis'};
function teaserCard(x,inner){   // x: {title, line?, img, pos?}; inner: the link of the panel, used where the campaign page is not this market's
  const ext=x.page&&S.market==='de';
  return `<a class="teaser" href="${esc(ext?WS+x.page:inner)}"${ext?' target="_blank" rel="noopener"':''}><img src="${esc(x.img)}" alt="" loading="lazy"${x.pos?` style="object-position:${x.pos}"`:''}>

  const x=TEASERS[TEASER_FOR[id]];
  return x?teaserCard(x,inner):image?teaserCard({title:label,img:image},inner):'';
}

function contentMenu(sec){
  const items=M().content[sec]; const cur=items.find(x=>x.id===S.sub)||items[0];
  const rail=items.map(x=>`<button class="u-row" data-sub="${x.id}" aria-current="${x.id===cur.id}"><span>${esc(tl(x.label))}${x.count?`<span class="u-count">${x.count}</span>`:''}</span>${chev}</button>`).join('');

function renderMenu(){
  $$('.svc-btn').forEach(b=>b.setAttribute('aria-expanded',S.open&&S.menu===b.dataset.menu));
  $$('.menu-toggle').forEach(b=>b.setAttribute('aria-expanded',S.open&&(S.menu==='products'||b.classList.contains('burger'))));   // the mobile burger closes whichever menu is open
  if(S.menu==='collections'){$('#menu').innerHTML=collectionsMenu();$('#menu').classList.remove('level-u');return;}
  if(SECL[S.menu]){$('#menu').innerHTML=contentMenu(S.menu);$('#menu').classList.toggle('level-u',S.level==='uni');return;}
  if(S.menu==='services'){$('#menu').innerHTML=servicesMenu();$('#menu').classList.toggle('level-u',S.level==='uni');return;}
  const us=U(); if(!S.uni||!us.some(u=>u.id===S.uni))S.uni=us[0].id;
  const u=findU(S.uni);
  if(aliasOn()&&S.alias==null)S.alias=AL()[0].id;   // the menu opens on the first alias
  const a=aliasOn()&&S.alias?AL().find(x=>x.id===S.alias):null;
  $('#menu').innerHTML=`<div class="menu-in"><div class="rail"><h2 class="rail-title">${esc(t('Products'))}</h2>
    ${railRows(us,u,a)}
    ${railLinks('products')}</div>
    <div class="panel" role="region" aria-labelledby="panel-title">${a?aliasPanel(a):panel(u)}</div></div>`;
  $('#menu').classList.toggle('level-u',S.level==='uni');
}
const mobile=()=>matchMedia('(max-width:899px)').matches;
function placeMenu(){const h=$('#site-header').getBoundingClientRect();$('#menu').style.top=(mobile()?h.bottom:h.bottom+scrollY)+'px'}
function openMenu(on,which){
  const wasOpen=S.open,prev=S.menu;
  if(which){if(which!==S.menu)S.sub=null;S.menu=which;}
  S.open=on; $('#menu').hidden=!on; $('#overlay').hidden=!on||mobile();
  if(on){if(!(wasOpen&&prev===S.menu)){S.level='root';renderMenu();}placeMenu();}else{$$('.menu-toggle,.svc-btn').forEach(b=>b.setAttribute('aria-expanded',false));}
  document.body.style.overflow=on&&mobile()?'hidden':'';
}
// Desktop with a mouse: the header entries open their menu on hover and it closes when the pointer leaves
// the nav bar and the menu. A mouse click then only opens (no toggle), so hover-then-click never closes it;
// keyboard and touch keep click to open and close.
const canHover=()=>!mobile()&&matchMedia('(hover:hover) and (pointer:fine)').matches;
let hoverT=0,leaveT=0;
const menuOf=b=>b.dataset.menu||'products';
function hoverOpen(b){clearTimeout(leaveT);clearTimeout(hoverT);const w=menuOf(b);if(S.open&&S.menu===w)return;
  hoverT=setTimeout(()=>openMenu(true,w),S.open?0:120);}
function hoverLeave(){clearTimeout(hoverT);if(S.open)leaveT=setTimeout(()=>openMenu(false),250);}
$$('#products-btn,.svc-btn').forEach(b=>{
  b.addEventListener('mouseenter',()=>{if(canHover())hoverOpen(b)});
});
[$('.h-nav'),$('#menu')].forEach(el=>{
  el.addEventListener('mouseenter',()=>{if(canHover())clearTimeout(leaveT)});
  el.addEventListener('mouseleave',()=>{if(canHover())hoverLeave()});
});
$$('.menu-toggle').forEach(b=>b.addEventListener('click',e=>{const any=b.classList.contains('burger');
  if(!any&&canHover()&&e.detail>0){clearTimeout(hoverT);openMenu(true,'products');return;}
  openMenu(!(S.open&&(any||S.menu==='products')),any&&S.open?undefined:'products')}));
$$('.svc-btn').forEach(b=>b.addEventListener('click',e=>{
  if(canHover()&&e.detail>0){clearTimeout(hoverT);openMenu(true,b.dataset.menu);return;}
  openMenu(!(S.open&&S.menu===b.dataset.menu),b.dataset.menu)}));
$('#overlay').addEventListener('click',()=>openMenu(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.open){openMenu(false);$$('.menu-toggle').find(b=>b.offsetParent)?.focus()}});
$('#menu').addEventListener('mouseover',e=>{const sb=e.target.closest('button.u-row[data-sub]');if(sb&&!mobile()&&sb.dataset.sub!==S.sub){S.sub=sb.dataset.sub;renderMenu();return;}const al=e.target.closest('button.u-row[data-alias]');if(al&&!mobile()&&al.dataset.alias!==S.alias){S.alias=al.dataset.alias;renderMenu();return;}const b=e.target.closest('button.u-row[data-uni]');if(b&&!mobile()&&(b.dataset.uni!==S.uni||S.alias)){S.uni=b.dataset.uni;S.alias='';renderMenu();}});
$('#menu').addEventListener('click',e=>{
  const tg=e.target.closest('[data-review]'); if(tg){e.preventDefault();showReview(tg.dataset.review);return;}
  const sw=e.target.closest('[data-menu]'); if(sw){S.menu=sw.dataset.menu;S.level='root';renderMenu();$('#menu').scrollTop=0;return;}
  if(e.target.closest('[data-svc]')){S.level='uni';renderMenu();$('#menu').scrollTop=0;return;}
  const sb=e.target.closest('[data-sub]'); if(sb){S.sub=sb.dataset.sub;S.level='uni';renderMenu();$('#menu').scrollTop=0;return;}
  const al=e.target.closest('button.u-row[data-alias]'); if(al){S.alias=al.dataset.alias;S.level='uni';renderMenu();$('#menu').scrollTop=0;const f=$('#menu .mobile-back');if(mobile()&&f)f.focus();return;}
  const b=e.target.closest('button.u-row'); if(b){S.uni=b.dataset.uni;S.alias='';S.level='uni';renderMenu();$('#menu').scrollTop=0;const f=$('#menu .mobile-back');if(mobile()&&f)f.focus();return;}
  if(e.target.closest('[data-back]')){S.level='root';renderMenu();return;}
  if(e.target.closest('a'))openMenu(false);
});
addEventListener('resize',()=>{if(S.open){placeMenu();$('#overlay').hidden=mobile()}});
addEventListener('scroll',()=>{if(S.open&&!mobile())placeMenu()},{passive:true});

function reviewCard(r,full){

  const path=[r.l1,r.l2,r.l3].filter(Boolean).map(tl).join(' › ');
  const prop=r.status==='Variation';
  return `<div class="review-card ${prop?'proposed':''}"><h3>${esc(r.level)}<span class="status ${r.status.toLowerCase()}">${esc(r.status)}</span></h3><dl>
   <dt>Where</dt><dd>${esc(path)}</dd><dt>Products</dt><dd>Germany ${r.de} · Spain ${r.es}</dd><dt>What it holds</dt><dd>${esc(r.holds)}</dd>
   <dt>Recommendation</dt><dd>${esc(r.rec)}</dd><dt>Why</dt><dd>${esc(r.why)}</dd>${r.decision?`<dt>Decision</dt><dd>${esc(r.decision)}</dd>`:''}</dl></div>`;
}
function showReview(id){
  const r=R[id]; if(!r)return;
  $('#dlg-body').innerHTML=`<div class="dlg-top"><span class="eyebrow" style="margin:0">Categories review · ${D.review.indexOf(r)+1} of ${D.review.length}</span><button class="x" data-close aria-label="Close">×</button></div>
   <h2>${esc(r.l3||r.l2||r.l1)}</h2>${reviewCard(r)}`;

$('#dlg').addEventListener('click',e=>{if(e.target.closest('[data-close]')||e.target===$('#dlg'))$('#dlg').close()});

function home(){
  const us=U(); const cats=us.flatMap(u=>u.cats); const subs=cats.flatMap(c=>c.subs);
  const nNew=subs.filter(s=>s.status==='New').length, nNewC=cats.filter(c=>c.status==='New').length, nProp=cats.filter(c=>c.status==='Variation').length+subs.filter(s=>s.status==='Variation').length;
  const open=D.review.filter(r=>r.status==='Open').length;
  return `<span class="eyebrow">WMF in NAMI · ${S.market==='de'?'Germany':'Spain'} · ${S.view==='alias'?'option: menu aliases':'NAMI structure'}</span>
  <h1>${S.view==='alias'?'Menu aliases':'Universes in the menu'}</h1>
  <p class="lead">NAMI now shows the universe (level 1) in the menu when a brand has too many categories. Open <b>Products</b>: the rail lists WMF's universes, ranked for ${S.market==='de'?'Germany':'Spain'}; each universe shows its categories (level 2) with their subcategories (level 3), as in the core brands menu. Yellow tags mark subcategories WMF needs that NAMI does not have. ${S.view==='alias'?`<b>Option shown: menu aliases.</b> The structure stays as it is. The first entries of the Products menu are aliases: top-level entries chosen for ${S.market==='de'?'Germany':'Spain'} that point to a category or subcategory and add type, navigation filter and range links. The universes follow under All products.`:'The Menu switch shows the alias option: top-level entries that point into this structure.'}</p>
  <div class="stats"><div class="stat"><b>${us.length}</b><span>universes</span></div><div class="stat"><b>${cats.length}</b><span>categories</span></div><div class="stat"><b>${subs.length}</b><span>subcategory links</span></div><div class="stat"><b>${nNew}</b><span>new subcategories</span></div>${nNewC?`<div class="stat"><b>${nNewC}</b><span>new ${nNewC>1?'categories':'category'}</span></div>`:''}${aliasOn()?`<div class="stat"><b>${AL().length}</b><span>aliases</span></div><div class="stat"><b>${AL().reduce((n,a)=>n+a.count,0)}</b><span>products behind the aliases</span></div>`:''}<div class="stat"><b>${M().products}</b><span>products</span></div></div>
  ${aliasOn()?aliasMap():''}<h2 class="sec">Menu map</h2><p class="sec-note">Every universe, category and subcategory in the menu, in menu order, with product counts. Categories with no subcategory list (accessories, and categories NAMI repeats as their only subcategory) are a single link.</p>
  <div class="map">${us.map(u=>`<div class="map-u"><h3><a href="${href(u.id)}">${esc(tl(u.label))}</a>${cnt(u.count)}${tag(u)}</h3>${u.cats.map(c=>`<div class="map-c"><a href="${href(u.id,c.id)}">${esc(tl(c.label))}</a>${cnt(c.count)}${tag(c,u)}${c.subs.length?`<ul>${c.subs.map(s=>`<li><a href="${href(u.id,c.id,s.id)}">${esc(tl(s.label))}</a>${cnt(s.count)}${tag(s,c)}</li>`).join('')}</ul>`:''}</div>`).join('')}</div>`).join('')}</div>
  <h2 class="sec">Categories review</h2><p class="sec-note">The new categories and subcategories WMF needs, one at a time. ${D.review.filter(r=>r.status==='Proposed').length} proposed to NAMI, ${open} open. Spare parts under the Services menu is confirmed for WMF. The same list is the Categories review tab of the workbook; select a row for the full note.</p>
  <table class="rv"><thead><tr><th>No.</th><th>New entry</th><th>Where</th><th>DE</th><th>ES</th><th class="hide-m">Recommendation</th><th>Status</th></tr></thead><tbody>
  ${D.review.map((r,i)=>`<tr data-review="${r.id}"><td class="num hide-m">${i+1}</td><td><b>${esc(r.l3||r.l2||(r.level==='Universe'?r.l1:r.level))}</b></td><td class="hide-m">${esc([r.l1,r.l2].filter(Boolean).join(' › '))}</td><td class="num hide-m">${r.de}</td><td class="num hide-m">${r.es}</td><td class="hide-m">${esc(r.rec)}</td><td><span class="status ${r.status.toLowerCase()}">${esc(r.status)}</span></td></tr>`).join('')}
  </tbody></table>`;

// every product of the market: [English name, Spanish name, image path, page path]
function prod(i){const it=M().items[i]||[];const u=it[3]||'';return {n:S.lang==='es'&&it[1]?it[1]:it[0],i:it[2],u:u?(u.startsWith('http')?u:M().urlBase+u):''}}
function cards(list){return `<div class="grid">${list.map(i=>{const p=prod(i);return `<a class="card" ${p.u?`href="${esc(p.u)}" target="_blank" rel="noopener"`:''}><div class="im">${p.i?`<img src="${esc(IM(p.i))}" alt="" loading="lazy">`:''}</div><span class="pn">${esc(p.n)}</span>${p.u?`<span class="src">wmf.com ↗</span>`:''}</a>`}).join('')}</div>`}
function dest(uid,cid,sid,fx){
  const u=findU(uid); const c=cid&&u.cats.find(x=>x.id===cid); const s=c&&sid&&c.subs.find(x=>x.id===sid);
  if(cid&&!c)return home();
  const node=s||c; const label=node?node.label:u.label; const count=node?node.count:u.count;
  const rv=R[(node||u).review]; let shown=count;
  const where=S.market==='de'?'Germany':'Spain';
  let body='';
  if(!c){   // universe: each category with a row of its first products
    body=u.cats.map(x=>`<section class="cat-sec"><div class="cat-sec-head"><h2><a href="${href(u.id,x.id)}">${esc(tl(x.label))}</a>${tag(x)}</h2><a class="see-all" href="${href(u.id,x.id)}">${esc(t('See all'))} ${x.count}${chev}</a></div>${cards(x.products.slice(0,6))}</section>`).join('');
  }else{
    const nf=M().filters&&((s&&M().filters[s.id])||M().filters[c.id]);   // a category's filters also show on its subcategory pages
    const chips0=c.subs.length?`<nav class="chips" aria-label="Subcategories"><a class="chip ${s?'':'on'}" href="${href(u.id,c.id)}">All <span>${c.count}</span></a>${c.subs.map(x=>`<a class="chip ${s&&s.id===x.id?'on':''}" href="${href(u.id,c.id,x.id)}">${esc(tl(x.label))} <span>${x.count}</span></a>`).join('')}</nav>`:'';
    let list=node.products, fnote='', frows='', chips=chips0;
    if(nf){
      const base=[u.id,c.id].concat(s?[s.id]:[]), inNode=new Set(node.products);
      const rs=nf.ranges.map(r=>({r,list:r.products.filter(i=>inNode.has(i))})).filter(x=>x.list.length);
      const row=(title,ch)=>`<div class="chip-row"><span>${esc(t(title))}</span>${ch}</div>`;
      if(fx&&fx[0]==='f')for(const g of nf.groups){const f=g.links.find(x=>'f:'+x.id===fx);if(f){if(f.products){list=f.products.filter(i=>inNode.has(i));fnote=`<b>Navigation filter:</b> ${esc(t(g.title))} = ${esc(tl(f.label))}. ${f.why?esc(f.why):'NAMI has no level below a subcategory, so the types work as a filter. wmf.com has them as subcategories.'}${f.note?' '+esc(f.note):''}`;}else fnote=`<b>Navigation filter:</b> ${esc(t(g.title))} = ${esc(tl(f.label))}. In the shop this narrows the list. The attribute is not in the catalogue data yet, so all ${list.length} products are listed.`;}}
      if(fx&&fx[0]==='r'){const x=rs.find(x=>'r:'+x.r.id===fx);if(x){list=x.list;fnote=`<b>Navigation filter:</b> ${esc(t('Range'))} = ${esc(x.r.label)}. It uses the range field planned for the PIM.`;}}
      if(chips0)chips=row('Type',chips0);
      frows=nf.groups.map(g=>row(g.title,`<nav class="chips">${g.links.map(x=>`<a class="chip ${fx==='f:'+x.id?'on':''}" href="${href(...base,'f:'+x.id)}">${esc(tl(x.label))}${x.count!=null?` <span>${x.count}</span>`:''}</a>`).join('')}</nav>`)).join('')
        +(rs.length?row('Range',`<nav class="chips">${rs.map(x=>`<a class="chip ${fx==='r:'+x.r.id?'on':''}" href="${href(...base,'r:'+x.r.id)}">${esc(x.r.label)} <span>${x.list.length}</span></a>`).join('')}</nav>`):'');
      shown=list.length;
    }
    const al=aliasOn()&&AL().find(x=>x.to[0]===u.id&&x.to[1]===c.id&&(x.to[2]||'')===(s?s.id:''));   // this page is the target of a menu alias
    body=`<div class="chip-rows">${chips}${frows}</div>`+(al?finderLink(al):'')+(fnote?`<div class="al-note" style="margin-top:18px">${fnote}</div>`:'')+cards(list);
  }
  return `<nav class="crumbs"><a href="#/">${esc(t('Home'))}</a>›<a href="${href(u.id)}">${esc(tl(u.label))}</a>${c?`›<a href="${href(u.id,c.id)}">${esc(tl(c.label))}</a>`:''}${s?`›<span>${esc(tl(s.label))}</span>`:''}</nav>
   <span class="eyebrow">${s?'Subcategory · level 3':c?'Category · level 2':'Universe · level 1'} · destination preview</span>
   <h1>${esc(tl(label))}</h1><p class="lead">${shown} ${esc(t('products'))} in ${where}${c?', all listed below':''}. Each product links to its wmf.com page.</p>
   ${rv?reviewCard(rv):''}
   ${body}
   <a class="btn" href="#/">Back to the menu map</a>`;
}
function servicesDest(gid){   // spare parts have one list, in Cookware accessories (Dan, 26 Nov 2026); old addresses forward to it
  const sp=M().services.spare; location.replace(href(...sp.to,'f:'+(gid||'spare-parts'))); return '';
}
const UO={};
function uniOf(){const k=S.market+S.view;if(!UO[k]){const o={};U().forEach(u=>u.cats.forEach(c=>c.products.forEach(i=>{o[i]=u})));UO[k]=o;}return UO[k];}
function collectionsIndex(){
  return `<nav class="crumbs"><a href="#/">${esc(t('Home'))}</a>›<span>${esc(t('Collections'))}</span></nav><span class="eyebrow">Collections · destination preview</span>
  <h1>${esc(t('Collections'))}</h1><p class="lead">Themes that cut across categories, and the top ranges beside them, as in the earlier prototype's suggestions menu (Dan, 13 Nov 2026). Each product links to wmf.com.</p>${collectionsBody(false)}`;
}
function collectionDest(kind,id,uid){
  const C=M().collections, x=(kind==='ranges'?C.ranges:C.themes).find(c=>c.id===id);
  if(!x)return collectionsIndex();
  const uo=uniOf(), gs=[]; x.products.forEach(i=>{const u=uo[i];if(!u)return;let g=gs.find(g=>g.u===u);if(!g)gs.push(g={u,n:0});g.n++});
  const list=uid?x.products.filter(i=>uo[i]&&uo[i].id===uid):x.products, cur=gs.find(g=>g.u.id===uid);
  const chips=gs.length>1?`<nav class="chips" aria-label="Universes"><a class="chip ${uid?'':'on'}" href="${href(kind,x.id)}">All <span>${x.count}</span></a>${gs.map(g=>`<a class="chip ${g.u.id===uid?'on':''}" href="${href(kind,x.id,g.u.id)}">${esc(tl(g.u.label))} <span>${g.n}</span></a>`).join('')}</nav>`:'';
  return `<nav class="crumbs"><a href="#/">${esc(t('Home'))}</a>›<a href="${href('collections')}">${esc(t('Collections'))}</a>›<span>${esc(tl(x.label))}</span></nav>
  <span class="eyebrow">${kind==='ranges'?'Top range':'Collection'} · destination preview</span><h1>${esc(tl(x.label))}</h1>
  <p class="lead">${esc(tl(x.description))}. ${list.length} ${esc(t('products'))}${cur?' in '+esc(tl(cur.u.label)):''} in ${S.market==='de'?'Germany':'Spain'}, all listed below${kind==='ranges'?'':', matched on product names and their NAMI category'}.</p>
  ${chips}${cards(list)}<a class="btn" href="${href('collections')}">All collections</a>`;
}
function contentDest(sec,id,kid){
  const items=M().content[sec], x=items.find(i=>i.id===id), where=S.market==='de'?'Germany':'Spain';
  const crumbs=(...a)=>`<nav class="crumbs"><a href="#/">${esc(t('Home'))}</a>›${a.join('›')}</nav>`;
  if(!x)return `${crumbs(`<span>${esc(t(SECL[sec]))}</span>`)}<span class="eyebrow">${esc(SECL[sec])} · destination preview</span><h1>${esc(t(SECL[sec]))}</h1>
    <ul class="kids" style="margin-top:22px">${items.map(i=>`<li><a href="${href(sec,i.id)}">${esc(tl(i.label))}</a></li>`).join('')}</ul>`;
  const top=`<a href="${href(sec)}">${esc(t(SECL[sec]))}</a>`;
  if(x.groups){
    const g=kid&&x.groups.find(g=>g.id===kid), list=g?g.products:x.products;
    const chips=`<nav class="chips" aria-label="Universes"><a class="chip ${g?'':'on'}" href="${href(sec,x.id)}">All <span>${x.count}</span></a>${x.groups.map(y=>`<a class="chip ${g&&g.id===y.id?'on':''}" href="${href(sec,x.id,y.id)}">${esc(tl(y.label))} <span>${y.count}</span></a>`).join('')}</nav>`;
    return `${crumbs(top,`<a href="${href(sec,x.id)}">${esc(tl(x.label))}</a>`+(g?`›<span>${esc(tl(g.label))}</span>`:''))}<span class="eyebrow">Offers · destination preview</span>
    <h1>${esc(g?tl(g.label):tl(x.label))}</h1><p class="lead">${list.length} sets in ${where}, all listed below. wmf.com decides which sets are on offer; prices are not part of this review.</p>${chips}${cards(list)}`;
  }
  const k=kid&&x.children.find(c=>c.id===kid);
  return `${crumbs(top,k?`<a href="${href(sec,x.id)}">${esc(tl(x.label))}</a>›<span>${esc(tl(k.label))}</span>`:`<span>${esc(tl(x.label))}</span>`)}
  <span class="eyebrow">${esc(SECL[sec])} · destination preview</span><h1>${esc(tl((k||x).label))}</h1><p class="lead">${esc(contentNote(sec,x))}</p>
  ${!k&&x.children.length?`<ul class="kids" style="margin-top:22px">${x.children.map(c=>`<li><a href="${href(sec,x.id,c.id)}">${esc(tl(c.label))}</a></li>`).join('')}</ul>`:''}
  ${sec==='offers'&&S.market==='de'?`<div style="max-width:360px;margin-top:26px">${club()}</div>`:''}<a class="btn" href="#/">Back to the menu map</a>`;
}
function route(){
  const p=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean).map(decodeURIComponent);
  const fx=p.length>2&&p[1]!=='alias'&&/^[fr]:/.test(p[p.length-1])?p.pop():null;   // a navigation filter on a category or subcategory page
  if(p[0]&&D.markets[p[0]]&&p[0]!==S.market){S.market=p[0];if(S.market==='de')S.lang='en';syncBar();}
  $('#main').innerHTML=p[1]==='alias'?aliasDest(p[2],p[3],p[4]):p[1]==='services'?servicesDest(p[3]):p[1]==='collections'||p[1]==='ranges'?collectionDest(p[1],p[2],p[3]):SECL[p[1]]?contentDest(p[1],p[2],p[3]):p.length>1?dest(p[1],p[2],p[3],fx):home();
  if(S.open)renderMenu();
  scrollTo(0,0);
}
$('#main').addEventListener('click',e=>{const tg=e.target.closest('[data-review]');if(tg&&!e.target.closest('a')){e.preventDefault();showReview(tg.dataset.review)}});

/* ---------- open search: suggests universes, categories and subcategories of the current market and menu view ---------- */
const fold=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function searchIndex(){
  const out=[];
  if(aliasOn())for(const a of AL())out.push({label:tl(a.label),alt:a.label,path:t('Alias'),count:a.count,href:ahref(a),lvl:0});
  for(const u of U()){
    out.push({label:tl(u.label),alt:u.label,path:'',count:u.count,href:href(u.id),lvl:0});
    for(const c of u.cats){
      out.push({label:tl(c.label),alt:c.label,path:tl(u.label),count:c.count,href:href(u.id,c.id),lvl:1});
      for(const s of c.subs)out.push({label:tl(s.label),alt:s.label,path:tl(u.label)+' › '+tl(c.label),count:s.count,href:href(u.id,c.id,s.id),lvl:2});
    }
  }
  return out;
}
function suggest(qs){
  const words=fold(qs).split(/\s+/).filter(Boolean); if(!words.length)return [];
  const scored=[];
  for(const e of searchIndex()){
    const L=fold(e.label), A=fold(e.alt), P=fold(e.path), hay=L+' '+A+' '+P;
    if(!words.every(w=>hay.includes(w)))continue;
    const w=words[0]; let sc=L.startsWith(w)?0:new RegExp('(^|[^a-z])'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).test(L)?1:L.includes(w)||A.includes(w)?2:3;
    scored.push([sc,e.lvl,-e.count,e]);
  }
  scored.sort((a,b)=>a[0]-b[0]||a[1]-b[1]||a[2]-b[2]);
  return scored.slice(0,8).map(x=>x[3]);
}
function markUp(label,qs){
  let h=esc(label); const f=fold(label);
  const w=fold(qs).split(/\s+/).filter(Boolean)[0]; const i=w?f.indexOf(w):-1;
  if(i>=0)h=esc(label.slice(0,i))+'<mark>'+esc(label.slice(i,i+w.length))+'</mark>'+esc(label.slice(i+w.length));
  return h;
}
let SEL=-1;
function renderSugg(){
  const qs=$('#q').value.trim(), box=$('#sugg');
  if(!qs){box.hidden=true;$('#q').setAttribute('aria-expanded','false');return;}
  const res=suggest(qs); SEL=-1;
  box.innerHTML=res.length?res.map((e,i)=>`<a href="${e.href}" role="option" id="sg${i}" aria-selected="false"><span>${markUp(e.label,qs)}${e.path?`<span class="path">${esc(e.path)}</span>`:''}</span><small>${e.count}</small></a>`).join(''):`<div class="empty">${esc(t('No matches in the menu'))}</div>`;
  box.hidden=false; $('#q').setAttribute('aria-expanded','true');
}
function moveSel(d){
  const opts=$$('#sugg a'); if(!opts.length)return;
  SEL=(SEL+d+opts.length)%opts.length;
  opts.forEach((o,i)=>o.setAttribute('aria-selected',i===SEL)); $('#q').setAttribute('aria-activedescendant','sg'+SEL); opts[SEL].scrollIntoView({block:'nearest'});
}
$('#q').addEventListener('input',renderSugg);
$('#q').addEventListener('focus',()=>{if(S.open)openMenu(false);renderSugg()});
$('#q').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();moveSel(1)}
  else if(e.key==='ArrowUp'){e.preventDefault();moveSel(-1)}
  else if(e.key==='Escape'){$('#sugg').hidden=true;$('#q').setAttribute('aria-expanded','false')}
});
$('#search').addEventListener('submit',e=>{e.preventDefault();const opts=$$('#sugg a');const a=opts[Math.max(SEL,0)];if(a){location.hash=a.getAttribute('href');}});
$('#sugg').addEventListener('click',e=>{if(e.target.closest('a')){$('#sugg').hidden=true;$('#q').blur();}});
document.addEventListener('click',e=>{if(!e.target.closest('#search')){$('#sugg').hidden=true;$('#q').setAttribute('aria-expanded','false')}});
addEventListener('hashchange',()=>{$('#sugg').hidden=true;$('#q').value=''});

/* ---------- review bar ---------- */
function syncBar(){
  $$('#seg-market button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.market===S.market));
  $$('#seg-lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===S.lang));
  $('#seg-lang').hidden=S.market!=='es';
  $$('#seg-view button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===S.view));
  $('#tags-btn').setAttribute('aria-pressed',S.tags);$('#tags-btn').textContent=S.tags?'On':'Off';
  document.body.classList.toggle('tags',S.tags);
  document.documentElement.lang=S.lang;
  $$('[data-t]').forEach(el=>{el.dataset.en??=el.textContent;el.textContent=t(el.dataset.en)});
  $('#q').placeholder=t('What are you looking for?'); if($('#q').value)renderSugg();
  $('#foot-note').textContent=`Data ${D.generated} · ${S.market==='de'?'wmf.com/de catalogue':'wmf.com/es catalogue'} · ${M().products} products`;
  store.set('wmf-uni-market',S.market);store.set('wmf-uni-lang',S.lang);store.set('wmf-uni-view',S.view);store.set('wmf-uni-tags',S.tags?'1':'0');
  // keep the address bar in step with the review bar, so the current view can be shared as a link
  try{const u=new URL(location.href);u.searchParams.set('view',S.view);u.searchParams.set('market',S.market);if(S.market==='es')u.searchParams.set('lang',S.lang);else u.searchParams.delete('lang');if(u.href!==location.href)history.replaceState(null,'',u);}catch(e){}
}
$('#review-bar').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  if(b.dataset.market){S.market=b.dataset.market;S.lang=S.market==='es'?S.lang:'en';S.uni=null;S.alias=null;location.hash='#/';}
  if(b.dataset.lang)S.lang=b.dataset.lang;
  if(b.dataset.view){S.view=b.dataset.view;S.alias=null;}
  if(b.id==='tags-btn')S.tags=!S.tags;
  syncBar(); route();
});
syncBar(); addEventListener('hashchange',route); route();
})();
</script>
